<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Кунлик вирд</title>
<meta name="theme-color" content="#0b2a20">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Вирд">
<style>
:root{
  --bg:#0b2a20; --bg2:#0f3528; --card:#13402f; --card2:#185039; --line:rgba(255,255,255,.08);
  --gold:#e8c468; --gold2:#f3d98f; --text:#f2f5f1; --muted:#9fb8ab; --ok:#4fd08b; --bad:#ff7a6b; --warn:#f0b24a; --blue:#7cc4ff;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(120% 60% at 50% -10%,#1c5a42 0%,var(--bg) 60%) fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--gold)}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:24px;margin:4px 0 2px}
h2{font-size:18px;margin:22px 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{background:var(--gold);color:#1b2a1f;font-weight:700;border-radius:14px;padding:13px 18px;width:100%;font-size:16px}
.btn.sec{background:var(--card2);color:var(--text);font-weight:600}
.btn.danger{background:#5a2420;color:#ffd0ca}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;border-radius:10px}
.btn:active{transform:scale(.98)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.chip.ok{background:rgba(79,208,139,.15);color:var(--ok)}
.chip.bad{background:rgba(255,122,107,.15);color:var(--bad)}
.chip.warn{background:rgba(240,178,74,.15);color:var(--warn)}
.chip.blue{background:rgba(124,196,255,.15);color:var(--blue)}
.chip.gold{background:rgba(232,196,104,.18);color:var(--gold)}

/* login */
#login .logo{width:84px;height:84px;border-radius:22px;display:block;margin:30px auto 12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#login h1{text-align:center}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.names button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;font-weight:600;font-size:16px}
.names button:active{background:var(--card2)}
.pin-dots{display:flex;gap:16px;justify-content:center;margin:26px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold);display:block}
.pin-dots i.on{background:var(--gold)}
.pin-dots.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center}
.pad button{height:76px;border-radius:50%;background:var(--card);font-size:28px;font-weight:500;border:1px solid var(--line)}
.pad button:active{background:var(--card2)}
.pad button.txt{font-size:14px;background:none;border:0;color:var(--muted)}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;flex:none}
.countdown{margin-top:12px;display:flex;align-items:center;gap:10px;background:rgba(232,196,104,.1);border:1px solid rgba(232,196,104,.25);color:var(--gold2);border-radius:14px;padding:10px 14px;font-size:14px}
.countdown b{font-variant-numeric:tabular-nums}
.countdown.urgent{background:rgba(255,122,107,.12);border-color:rgba(255,122,107,.3);color:#ffb3a9}

/* tasks */
.task{display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer;user-select:none}
.task .ic{width:48px;height:48px;border-radius:14px;background:var(--bg2);display:grid;place-items:center;font-size:24px;flex:none}
.task .t1{font-weight:700;font-size:17px}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none;transition:.2s}
.task.done{border-color:rgba(79,208,139,.45);background:linear-gradient(180deg,#145a3a,#10412d)}
.task.done .check{background:var(--ok);border-color:var(--ok)}
.task.done .check::after{content:"";width:10px;height:17px;border:solid #0b2a20;border-width:0 3.5px 3.5px 0;transform:rotate(45deg) translate(-1px,-2px)}

/* zikr */
.zikr{text-align:center;padding:18px 16px 16px}
.ring{position:relative;width:250px;height:250px;margin:6px auto 8px;border-radius:50%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .tap{position:absolute;inset:22px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#1f6b4d,#0f3a2a);border:1px solid rgba(232,196,104,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -10px 30px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.25);transition:transform .06s}
.ring .tap:active,.ring .tap.press{transform:scale(.96)}
.ring .num{font-size:58px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.ring .of{color:var(--muted);font-size:15px;margin-top:4px}
.ring .hint{color:var(--gold);font-size:13px;margin-top:10px;font-weight:600}
.ring.full .tap{background:radial-gradient(circle at 50% 35%,#2f8a5f,#145a3a);border-color:var(--ok)}
.zrow{display:flex;gap:8px;justify-content:center}
.sync{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}

/* days strip */
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px}
.strip i{aspect-ratio:1;border-radius:6px;background:var(--bg2);display:block}
.strip i.done{background:var(--ok)}
.strip i.missed{background:var(--bad)}
.strip i.excused{background:var(--blue)}
.strip i.today{outline:2px solid var(--gold);outline-offset:-2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* lists */
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;flex:none;color:var(--gold2)}
.av.ok{background:rgba(79,208,139,.2);color:var(--ok)}
.marks{display:flex;gap:5px;font-size:15px}
.marks span{opacity:.25}
.marks span.on{opacity:1}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank{width:22px;text-align:center;color:var(--muted);font-weight:700;flex:none}
.bar{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg2);border-radius:14px;padding:14px}
.stat .v{font-size:24px;font-weight:800;margin-top:4px}
.stat.big{grid-column:1/-1;background:linear-gradient(135deg,#6b5418,#3d3210);border:1px solid rgba(232,196,104,.35)}
.stat.big .v{font-size:32px;color:var(--gold2)}

.monthsw{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.monthsw h2{margin:0}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,42,32,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:center;z-index:10}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 0;font-weight:600}
nav button .e{font-size:22px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--gold)}
nav button.on .e{filter:none;opacity:1}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
.sheet{background:var(--bg2);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:88vh;overflow:auto;animation:up .2s}
.sheet h3{margin:0 0 14px;font-size:19px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.sw{width:52px;height:32px;border-radius:16px;background:#2a4a3d;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}
.sw.on::after{left:23px}
.btns{display:flex;gap:10px;margin-top:16px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:#fff;color:#122;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center;animation:fade .2s}
.toast.err{background:#ffdcd7;color:#5a1a12}
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.celebrate i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.empty{text-align:center;color:var(--muted);padding:20px 0}
.steps{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:14px;line-height:1.6}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="wrap hidden">
  <img class="logo" src="icon-192.png" alt="">
  <h1>Кунлик вирд</h1>
  <p class="muted" style="text-align:center;margin:4px 0 0">Китоб · Қуръон · Зикр</p>
  <div id="pickName">
    <h2 style="text-align:center">Исмингизни танланг</h2>
    <div class="names" id="names"><div class="empty" style="grid-column:1/-1">Юкланмоқда…</div></div>
  </div>
  <div id="pickPin" class="hidden">
    <h2 style="text-align:center" id="pinTitle"></h2>
    <p class="muted small" style="text-align:center;margin:0">PIN кодни киритинг</p>
    <div class="pin-dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="pad" id="pad"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="wrap hidden">
  <div class="top">
    <div class="grow">
      <div class="muted small" id="hDate"></div>
      <h1 id="hTitle"></h1>
    </div>
    <button class="iconbtn" id="btnSettings" aria-label="Созламалар">⚙️</button>
  </div>
  <div id="views">
    <section id="v-today"></section>
    <section id="v-group" class="hidden"></section>
    <section id="v-fines" class="hidden"></section>
    <section id="v-admin" class="hidden"></section>
  </div>
</div>

<nav id="nav" class="hidden"><div class="in">
  <button data-v="today" class="on"><span class="e">📿</span>Бугун</button>
  <button data-v="group"><span class="e">👥</span>Гуруҳ</button>
  <button data-v="fines"><span class="e">💰</span>Жамғарма</button>
  <button data-v="admin" id="navAdmin" class="hidden"><span class="e">🛠️</span>Админ</button>
</div></nav>

<div id="boot" class="loading">Юкланмоқда…</div>

<script>
// ================== CONFIG ==================
const SB_URL = 'https://pdzflfmjtawmfbdxqozu.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkemZsZm1qdGF3bWZiZHhxb3p1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MDIyNTQsImV4cCI6MjExMDM3ODI1NH0.hz16H_Sr9vCoTd4W9jc0D5I6TwD69lskvSbmW6310vU';
const GOAL_ZIKR = 1000;
const TZ_OFFSET = 6 * 3600 * 1000; // Asia/Bishkek, UTC+6

const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_G = ['январ','феврал','март','апрел','май','июн','июл','август','сентябр','октябр','ноябр','декабр'];
const WDAYS = ['Якшанба','Душанба','Сешанба','Чоршанба','Пайшанба','Жума','Шанба'];
const ERR = {
  BAD_PIN: 'PIN код нотўғри', NO_USER: 'Фойдаланувчи топилмади', NOT_ADMIN: 'Фақат админ учун',
  PIN_FORMAT: 'PIN 4 та рақамдан иборат бўлиши керак', NAME: 'Исмни киритинг', FUTURE: 'Келажак кунни ўзгартириб бўлмайди',
  SELF: 'Ўзингизни админликдан олиб бўлмайди', BAD_VALUE: 'Нотўғри қиймат'
};

// ================== HELPERS ==================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ') + ' сом';
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(_) { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(_) {} },
  del(k){ try { localStorage.removeItem(k); } catch(_) {} }
};
function toast(msg, err){
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
async function rpc(fn, args, opts){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {}), keepalive: !!(opts && opts.keepalive)
  });
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(_) {}
  if (!r.ok) { const m = (j && j.message) || 'ERROR'; const e = new Error(ERR[m] || m); e.code = m; throw e; }
  return j;
}
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y, m-1, d)); }
function fmtD(s){ const d = parseD(s); return `${d.getUTCDate()} ${MONTHS_G[d.getUTCMonth()]}`; }
function fmtLong(s){ const d = parseD(s); return `${WDAYS[d.getUTCDay()]}, ${d.getUTCDate()} ${MONTHS_G[d.getUTCMonth()]}`; }
function addDays(s, n){ const d = parseD(s); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function initials(n){ return (n||'?').trim().slice(0,1).toUpperCase(); }
function vibrate(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(_) {} }
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

// ================== STATE ==================
let session = store.get('vird_session'); // {id, pin, name, is_admin}
let S = null;            // server state
let clockSkew = 0;       // serverNow - clientNow
let view = 'today';
let month = null;        // 'YYYY-MM-01' for group view
let zk = { server: 0, pending: 0, timer: null, inflight: false };
let myDays = [];

// ================== LOGIN ==================
async function showLogin(){
  $('#boot').classList.add('hidden'); $('#app').classList.add('hidden'); $('#nav').classList.add('hidden');
  $('#login').classList.remove('hidden'); $('#pickName').classList.remove('hidden'); $('#pickPin').classList.add('hidden');
  try {
    const list = await rpc('zk_members_list');
    $('#names').innerHTML = list.length ? list.map(m => `<button data-id="${m.id}" data-name="${esc(m.name)}">${esc(m.name)}</button>`).join('')
      : '<div class="empty" style="grid-column:1/-1">Ҳали аъзолар йўқ</div>';
  } catch(e){ $('#names').innerHTML = `<div class="empty" style="grid-column:1/-1">Интернет йўқ. Қайта уриниб кўринг.</div>`; }
}
let pinFor = null, pinBuf = '';
$('#names').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  pinFor = { id: +b.dataset.id, name: b.dataset.name }; pinBuf = '';
  $('#pinTitle').textContent = pinFor.name; drawDots();
  $('#pickName').classList.add('hidden'); $('#pickPin').classList.remove('hidden');
});
$('#pad').innerHTML = [1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('') +
  '<button class="txt" data-k="back">← Орқага</button><button data-k="0">0</button><button class="txt" data-k="del">Ўчириш</button>';
function drawDots(){ [...$('#dots').children].forEach((d,i) => d.classList.toggle('on', i < pinBuf.length)); }
$('#pad').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return; const k = b.dataset.k;
  if (k === 'back'){ $('#pickPin').classList.add('hidden'); $('#pickName').classList.remove('hidden'); return; }
  if (k === 'del'){ pinBuf = pinBuf.slice(0,-1); drawDots(); return; }
  if (pinBuf.length >= 4) return;
  pinBuf += k; drawDots(); vibrate(8);
  if (pinBuf.length === 4){
    try {
      const me = await rpc('zk_login', { p_id: pinFor.id, p_pin: pinBuf });
      session = { id: me.id, pin: pinBuf, name: me.name, is_admin: me.is_admin };
      store.set('vird_session', session);
      startApp();
    } catch(err){
      const d = $('#dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
      vibrate([60,40,60]); toast(err.message, true); pinBuf = ''; setTimeout(drawDots, 300);
    }
  }
});

// ================== APP ==================
async function startApp(){
  $('#login').classList.add('hidden'); $('#boot').classList.remove('hidden');
  try { await loadState(); }
  catch(e){
    if (e.code === 'BAD_PIN' || e.code === 'NO_USER'){ store.del('vird_session'); session = null; return showLogin(); }
    $('#boot').textContent = 'Интернет йўқ. Саҳифани янгиланг.'; return;
  }
  $('#boot').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#nav').classList.remove('hidden');
  $('#navAdmin').classList.toggle('hidden', !S.me.is_admin);
  render();
  loadMyDays();
}
async function loadState(){
  const t0 = Date.now();
  S = await rpc('zk_state', { p_id: session.id, p_pin: session.pin, p_month: month });
  clockSkew = new Date(S.now).getTime() - (t0 + Date.now())/2;
  if (!month) month = S.month;
  session.name = S.me.name; session.is_admin = S.me.is_admin; store.set('vird_session', session);
  const me = S.members.find(m => m.id === S.me.id);
  if (me && !zk.inflight) zk.server = me.zikr;
}
async function loadMyDays(){
  try {
    myDays = await rpc('zk_history', { p_id: session.id, p_pin: session.pin, p_member: session.id, p_from: addDays(S.today, -13), p_to: S.today });
    if (view === 'today') renderStrip();
  } catch(_) {}
}
async function refresh(){
  try { await flushZikr(); await loadState(); render(); loadMyDays(); } catch(_) {}
}

// ---------- countdown ----------
function msToMidnight(){
  const now = Date.now() + clockSkew + TZ_OFFSET;
  return 86400000 - (now % 86400000);
}
function tickCountdown(){
  const el = $('#cd'); if (!el || !S) return;
  const ms = msToMidnight(); const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000), s = Math.floor(ms%60000/1000);
  const done = isDoneToday();
  el.classList.toggle('urgent', !done && ms < 3*3600000);
  el.innerHTML = done ? '✅ <span>Бугунги вазифалар бажарилди. Аллоҳ қабул қилсин!</span>'
    : `⏳ <span>00:00 гача: <b>${h} соат ${String(m).padStart(2,'0')} дақиқа ${String(s).padStart(2,'0')}</b></span>`;
  if (ms < 1500) setTimeout(refresh, 3000); // new day
}
setInterval(tickCountdown, 1000);
function isDoneToday(){ const m = me(); return m.excused || (m.book && m.quran && zk.server + zk.pending >= GOAL_ZIKR); }

  const c = $('#zChip'); c.className = 'chip ' + (z>=GOAL_ZIKR?'ok':'gold'); c.textContent = z>=GOAL_ZIKR ? 'Бажарилди' : (GOAL_ZIKR-z)+' қолди';

function addZikr(n){
  const before = zk.server + zk.pending;
  if (before + n < 0) return;
  const was = isDoneToday();
  zk.pending += n; vibrate(n === 1 ? 10 : 20);
  const after = zk.server + zk.pending;
  if (before < GOAL_ZIKR && after >= GOAL_ZIKR){ vibrate([80,60,80]); toast('Машааллоҳ! 1000 зикр бажарилди 🤲'); }
  if (after % 100 === 0 && after < GOAL_ZIKR && n === 1) vibrate(40);
  drawRing(); tickCountdown(); renderStrip();
  if (!was && isDoneToday()) celebrate();
  clearTimeout(zk.timer); zk.timer = setTimeout(flushZikr, 900);
}
async function flushZikr(keepalive){
  if (!zk.pending || zk.inflight || !session) return;
  const send = Math.max(-1000, Math.min(2000, zk.pending));
  zk.inflight = true;
  try {
    const v = await rpc('zk_add_zikr', { p_id: session.id, p_pin: session.pin, p_add: send }, { keepalive });
    zk.pending -= send; zk.server = v; const m = me(); m.zikr = v;
  } catch(err){
    if (!keepalive) { $('#zSync') && ($('#zSync').textContent = 'Интернет йўқ — кейинроқ сақланади'); }
  } finally {
    zk.inflight = false; drawRing();
    if (zk.pending) { clearTimeout(zk.timer); zk.timer = setTimeout(flushZikr, 3000); }
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushZikr(true);
  else if (session && S) refresh();
});

function celebrate(){
  const box = document.createElement('div'); box.className = 'celebrate';
  const colors = ['#e8c468','#4fd08b','#7cc4ff','#ff9f7a','#ffffff'];
  for (let i = 0; i < 70; i++){
    const p = document.createElement('i');
    p.style.left = Math.random()*100 + 'vw'; p.style.background = colors[i % colors.length];
    p.style.animationDelay = (Math.random()*0.6) + 's'; p.style.animationDuration = (1.8 + Math.random()*1.4) + 's';
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 4000);
  toast('Бугунги барча вазифалар бажарилди! 🎉');
}

      { k:'remove', label:'Гуруҳдан чиқариш', type:'switch', val: false }
    ], 'Сақлаш');
    if (!r) return;
    if (r.remove && !await confirmBox(`${m.name} гуруҳдан чиқарилсинми?`, 'Унинг тарихи сақланиб қолади.')) return;
    try { await rpc('zk_admin_update_member', { p_id: session.id, p_pin: session.pin, p_member: m.id, p_name: r.name, p_new_pin: r.pin || null, p_admin: !!r.admin, p_active: !r.remove });
      toast('Сақланди ✓'); if (r.remove && adm.member === m.id) adm.member = null; await loadState(); renderAdmin(); loadAdminDays(); }
    catch(err){ toast(err.message, true); }
    return;
  }
  const dd = e.target.closest('[data-day]');
  if (dd){
    const d = adm.days.find(x => x.day === dd.dataset.day); const m = S.members.find(x => x.id === adm.member);
    const r = await formBox(`${m.name} · ${fmtLong(d.day)}`, [
      { k:'book', label:'📖 Китоб — 4 бет', type:'switch', val: d.book },
      { k:'quran', label:'📗 Қуръон — 4 бет', type:'switch', val: d.quran },
      { k:'zikr', label:'📿 Зикр сони', type:'number', val: d.zikr },
      { k:'excused', label:'🩺 Узрли кун (жарима йўқ)', type:'switch', val: d.excused },
      ...(d.day !== S.today ? [{ k:'paid', label:'💰 Жарима тўланган', type:'switch', val: d.paid }] : [])
    ], 'Сақлаш');
    if (!r) return;
    try {
      await rpc('zk_admin_set_day', { p_id: session.id, p_pin: session.pin, p_member: m.id, p_day: d.day, p_book: !!r.book, p_quran: !!r.quran, p_zikr: parseInt(r.zikr,10) || 0, p_excused: !!r.excused });
      if (d.day !== S.today && !!r.paid !== d.paid) await rpc('zk_admin_set_paid', { p_id: session.id, p_pin: session.pin, p_member: m.id, p_day: d.day, p_paid: !!r.paid });
      toast('Сақланди ✓'); await loadState(); if (m.id === S.me.id) { zk.server = me().zikr; } await loadAdminDays();
    } catch(err){ toast(err.message, true); }
  }
});

// ---------- SETTINGS ----------
$('#btnSettings').addEventListener('click', () => {
  const perm = ('Notification' in window) ? Notification.permission : 'unsupported';
  const box = modal(`
    <h3>Созламалар</h3>
    <div class="card"><div class="muted small">Сиз</div><div style="font-weight:700;font-size:18px">${esc(S.me.name)}</div><div class="muted small">${S.me.is_admin?'Админ':'Аъзо'}</div></div>
    <div class="card">
      <div style="font-weight:700">🔔 Эслатмалар</div>
      <p class="muted small" style="margin:6px 0 10px">Соат 21:00 ва 23:00 да вазифаларни бажармаганларга эслатма келади.</p>
      ${pushStatusHtml(perm)}
    </div>
    <div class="card">
      <div style="font-weight:700">📲 Телефон экранига қўшиш</div>
      ${installHelp()}
    </div>
    <button class="btn sec" id="sPin">🔑 PIN кодни ўзгартириш</button>
    <div style="height:10px"></div>
    <button class="btn danger" id="sOut">Чиқиш</button>
    <div style="height:10px"></div>
    <button class="btn sec" data-close>Ёпиш</button>
  `);
  box.addEventListener('click', async e => {
    if (e.target.closest('#btnPush2')) { close(box); enablePush(); }
    if (e.target.closest('#sOut')) { close(box); await flushZikr(); store.del('vird_session'); session = null; S = null; month = null; zk = { server:0, pending:0, timer:null, inflight:false }; showLogin(); }
    if (e.target.closest('#sPin')) {
      close(box);
      const r = await formBox('PIN кодни ўзгартириш', [{ k:'pin', label:'Янги PIN (4 рақам)', type:'tel', max:4, ph:'••••' }], 'Сақлаш');
      if (!r) return;
      try { await rpc('zk_change_pin', { p_id: session.id, p_pin: session.pin, p_new: r.pin }); session.pin = r.pin; store.set('vird_session', session); toast('PIN ўзгартирилди ✓'); }
      catch(err){ toast(err.message, true); }
    }
  });
});
function installHelp(){
  if (isStandalone) return '<p class="muted small" style="margin:6px 0 0">✅ Илова экранга қўшилган.</p>';
  if (isIOS) return `<ol class="steps"><li>Safari пастидаги <b>«Поделиться»</b> (⬆️) тугмасини босинг</li><li><b>«На экран Домой»</b> ни танланг</li><li><b>«Добавить»</b> ни босинг</li><li>Экрандаги «Вирд» белгисидан очинг</li></ol>`;
  return `<ol class="steps"><li>Chrome ёки Samsung Internet да юқоридаги <b>⋮</b> (ёки пастдаги <b>☰</b>) менюни очинг</li><li><b>«Добавить на главный экран»</b> ёки <b>«Установить приложение»</b> ни танланг</li><li>Экрандаги «Вирд» белгисидан очинг</li></ol>`;
}

// ---------- PUSH ----------
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function pushStatusHtml(perm){
  if (isIOS && !isStandalone) return '<p class="small" style="color:var(--warn);margin:0">iPhone да эслатмалар учун аввал иловани экранга қўшинг (пастдаги кўрсатма), кейин уни экрандан очиб, шу тугмани босинг.</p>';
  if (!pushSupported()) return '<p class="small" style="color:var(--warn);margin:0">Бу браузер эслатмаларни қўллаб-қувватламайди. Chrome ёки Safari дан очинг.</p>';
  if (perm === 'granted' && store.get('vird_push_ok') === session.id) return '<span class="chip ok">✓ Ёқилган</span> <button class="btn sec sm" id="btnPush2" style="margin-left:8px">Қайта улаш</button>';
  if (perm === 'denied') return '<p class="small" style="color:var(--bad);margin:0">Эслатмалар браузер созламаларида ўчирилган. Телефон созламаларидан бу сайтга рухсат беринг.</p>';
  return '<button class="btn" id="btnPush2">🔔 Эслатмаларни ёқиш</button>';
}
function pushBanner(){
  if (!session) return '';
  const perm = ('Notification' in window) ? Notification.permission : 'unsupported';
  if (perm === 'granted' && store.get('vird_push_ok') === session.id) return '';
  if (store.get('vird_push_hide')) return '';
  if (isIOS && !isStandalone) return `<div class="card" style="border-color:rgba(232,196,104,.35)"><div style="font-weight:700">🔔 Эслатмалар олиш учун</div>${installHelp()}</div>`;
  if (!pushSupported() || perm === 'denied') return '';
  return `<div class="card" style="border-color:rgba(232,196,104,.35)"><div style="font-weight:700">🔔 Эслатмаларни ёқинг</div><p class="muted small" style="margin:6px 0 12px">Соат 21:00 ва 23:00 да эслатма келади, агар вазифалар бажарилмаган бўлса.</p><button class="btn" id="btnPush">Ёқиш</button></div>`;
}
function b64ToU8(b64){ const p = '='.repeat((4 - b64.length % 4) % 4); const s = atob((b64 + p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...s].map(c => c.charCodeAt(0))); }
async function enablePush(){
  if (isIOS && !isStandalone) return toast('Аввал иловани экранга қўшинг (⚙️ Созламалар)', true);
  if (!pushSupported()) return toast('Бу браузерда эслатмалар ишламайди', true);
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('Рухсат берилмади', true);
    const reg = await navigator.serviceWorker.ready;
    const key = await rpc('zk_vapid_public');
    let sub = await reg.pushManager.getSubscription();
    if (sub) { try { await sub.unsubscribe(); } catch(_) {} }
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(key) });
    const j = sub.toJSON();
    await rpc('zk_save_push', { p_id: session.id, p_pin: session.pin, p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
    store.set('vird_push_ok', session.id);
    reg.showNotification('🔔 Эслатмалар ёқилди', { body: 'Соат 21:00 ва 23:00 да эслатма келади.', icon: 'icon-192.png' });
    toast('Эслатмалар ёқилди ✓');
    if (view === 'today') renderToday();
  } catch(err){ toast('Хатолик: ' + (err.message || err), true); }
}

// ---------- modal helpers ----------
function modal(html){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) close(m); });
  document.body.appendChild(m); return m;
}
function close(m){ m && m.remove(); }
function confirmBox(title, text){
  return new Promise(res => {
    const m = modal(`<h3>${esc(title)}</h3>${text ? `<p class="muted">${esc(text)}</p>` : ''}<div class="btns"><button class="btn sec" data-no>Йўқ</button><button class="btn" data-yes>Ҳа</button></div>`);
    m.addEventListener('click', e => {
      if (e.target.closest('[data-yes]')) { close(m); res(true); }
      else if (e.target.closest('[data-no]') || e.target === m) { close(m); res(false); }
    });
  });
}
function formBox(title, fields, okText){
  return new Promise(res => {
    const html = fields.map(f => f.type === 'switch'
      ? `<div class="toggle"><span>${esc(f.label)}</span><div class="sw ${f.val?'on':''}" data-sw="${f.k}"></div></div>`
      : `<div class="field"><label>${esc(f.label)}</label><input data-k="${f.k}" type="${f.type==='number'?'number':f.type==='tel'?'tel':'text'}" ${f.type==='tel'||f.type==='number'?'inputmode="numeric"':''} ${f.max?`maxlength="${f.max}"`:''} placeholder="${esc(f.ph||'')}" value="${esc(f.val ?? '')}"></div>`).join('');
    const m = modal(`<h3>${esc(title)}</h3>${html}<div class="btns"><button class="btn sec" data-cancel>Бекор қилиш</button><button class="btn" data-ok>${esc(okText||'OK')}</button></div>`);
    m.addEventListener('click', e => {
      const sw = e.target.closest('[data-sw]'); if (sw) { sw.classList.toggle('on'); return; }
      if (e.target.closest('[data-ok]')) {
        const out = {};
        m.querySelectorAll('[data-k]').forEach(i => out[i.dataset.k] = i.value.trim());
        m.querySelectorAll('[data-sw]').forEach(s => out[s.dataset.sw] = s.classList.contains('on'));
        close(m); res(out);
      } else if (e.target.closest('[data-cancel]') || e.target === m) { close(m); res(null); }
    });
    const first = m.querySelector('input'); if (first && !isIOS) setTimeout(() => first.focus(), 100);
  });
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
setInterval(() => { if (session && S && document.visibilityState === 'visible' && !zk.pending) refresh(); }, 60000);
session ? startApp() : showLogin();
