<script>
/*
 * Common Wallet - calculation rules.
 * This file contains NO screens and NO internet code. It only does the maths:
 * weekly deadlines, who owes what, the balance, history and reports.
 * It is tested by tests/logic.test.js.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.CW = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var TZ = 'Asia/Bishkek';          // all dates are shown in Kyrgyzstan time
  var DEADLINE_DOW = 6;             // 6 = Saturday
  var VOTES_NEEDED = 2;             // expense needs 2 approvals from the other 3 friends
  var MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль',
    'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  var MONTHS_SHORT = ['янв.', 'февр.', 'мар.', 'апр.', 'мая', 'июн.', 'июл.', 'авг.', 'сент.', 'окт.', 'нояб.', 'дек.'];
  var DAYS = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  // 1 неделя, 2 недели, 5 недель
  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  // ---------- dates (plain "YYYY-MM-DD" text, no time zone surprises) ----------
  function pad(n) { return String(n).padStart(2, '0'); }
  function parseDate(s) { var p = s.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function fmtDate(ms) {
    var d = new Date(ms);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  function addDays(s, n) { return fmtDate(parseDate(s) + n * 86400000); }
  function dayOfWeek(s) { return new Date(parseDate(s)).getUTCDay(); }
  function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }

  // The date (in Kyrgyzstan) of a moment in time
  function localDate(ts) {
    if (!ts || isNaN(new Date(ts).getTime())) return '';
    var parts = new Intl.DateTimeFormat('en-US', {
      timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date(ts));
    var o = {};
    parts.forEach(function (p) { o[p.type] = p.value; });
    return o.year + '-' + o.month + '-' + o.day;
  }
  function today() { return localDate(Date.now()); }

  function prettyDate(s, withWeekday) {
    if (!s) return '';
    var p = s.split('-').map(Number);
    var text = p[2] + ' ' + MONTHS_SHORT[p[1] - 1] + ' ' + p[0];
    return withWeekday ? DAYS[dayOfWeek(s)] + ', ' + text : text;
  }
  function prettyDateTime(ts) {
    if (!ts) return '';
    var t = new Intl.DateTimeFormat('ru-RU', {
      timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false
    }).format(new Date(ts));
    return prettyDate(localDate(ts)) + ', ' + t;
  }
  function monthLabel(ym) {
    var p = ym.split('-').map(Number);
    return MONTHS[p[1] - 1] + ' ' + p[0];
  }

  function formatKGS(n) {
    var v = Math.round(Number(n) || 0);
    var digits = String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
    return (v < 0 ? '\u2212' : '') + digits + '\u00A0сом';
  }

  // ---------- weekly deadlines ----------
  // The first deadline is the first Saturday on or after the start date.
  function firstDeadline(startDate) {
    var d = dayOfWeek(startDate);
    return addDays(startDate, (DEADLINE_DOW - d + 7) % 7);
  }
  // All deadlines from the first one up to (and including) the current week's deadline.
  function deadlinesUpTo(startDate, todayStr) {
    var out = [];
    var cur = firstDeadline(startDate);
    for (var i = 0; i < 2000; i++) {
      out.push(cur);
      if (cur >= todayStr) break;
      cur = addDays(cur, 7);
    }
    return out;
  }

  // ---------- who owes what ----------
  // Only APPROVED contributions count. Money is applied to the oldest unpaid week first.
  function memberSummary(memberId, settings, contributions, todayStr) {
    var weekly = settings.weekly_amount;
    var deadlines = deadlinesUpTo(settings.start_date, todayStr);
    var marked = {};
    (settings.week_marks || []).forEach(function (k) { if (k.member_id === memberId) marked[k.deadline] = true; });
    var weeks = deadlines.map(function (d) {
      return marked[d] ? { deadline: d, paid: weekly, completedOn: d, marked: true } : { deadline: d, paid: 0, completedOn: null };
    });

    var mine = contributions.filter(function (c) {
      return c.member_id === memberId && c.status === 'approved' && c.transfer_date <= todayStr;
    }).sort(function (a, b) {
      if (a.transfer_date !== b.transfer_date) return a.transfer_date < b.transfer_date ? -1 : 1;
      return a.id - b.id;
    });

    var credit = 0, wi = 0, totalApproved = 0;
    mine.forEach(function (c) {
      var left = c.amount;
      totalApproved += c.amount;
      while (left > 0 && wi < weeks.length) {
        var w = weeks[wi];
        if (w.marked) { wi++; continue; }
        var take = Math.min(weekly - w.paid, left);
        w.paid += take;
        left -= take;
        if (w.paid >= weekly) { w.completedOn = c.transfer_date; wi++; }
      }
      credit += left;
    });

    var debt = 0, missed = 0;
    weeks.forEach(function (w) {
      w.due = weekly;
      w.remaining = Math.max(0, weekly - w.paid);
      w.partial = w.paid > 0 && w.paid < weekly;
      if (w.paid >= weekly) {
        w.status = w.completedOn > w.deadline ? 'paid_late' : 'paid';
      } else if (w.deadline < todayStr) {
        w.status = 'overdue';
        debt += w.remaining;
        missed += 1;
      } else {
        w.status = w.paid > 0 ? 'partial' : 'due';
      }
    });

    var current = weeks[weeks.length - 1];
    var streak = 0, si = weeks.length - 1;
    if (weeks[si].status !== 'paid') si--;
    for (; si >= 0; si--) { if (weeks[si].status === 'paid') streak++; else break; }
    return {
      streak: streak,
      lit: weeks[weeks.length - 1].status === 'paid',
      currentPaid: weeks[weeks.length - 1].status === 'paid' || weeks[weeks.length - 1].status === 'paid_late',
      memberId: memberId,
      weeks: weeks,
      current: current,
      debt: debt,                       // overdue amount only
      missedWeeks: missed,
      totalApproved: totalApproved,
      creditAhead: credit,              // paid in advance for future weeks
      toPayNow: debt + current.remaining, // overdue + this week
      nextDeadline: current.deadline
    };
  }

  // ---------- balance ----------
  function sum(list, pick) {
    return list.reduce(function (t, x) { return t + pick(x); }, 0);
  }
  function balanceInfo(settings, contributions, expenses) {
    var opening = settings.opening_balance || 0;
    var approved = contributions.filter(function (c) { return c.status === 'approved'; });
    var paid = expenses.filter(function (e) { return e.status === 'paid'; });
    var confirmedIn = sum(approved, function (c) { return c.amount; });
    var paidOut = sum(paid, function (e) { return e.amount; });
    return {
      opening: opening,
      confirmedIn: confirmedIn,
      paidOut: paidOut,
      confirmed: opening + confirmedIn - paidOut,   // the ONLY number called "balance"
      pendingIn: sum(contributions.filter(function (c) { return c.status === 'pending'; }),
        function (c) { return c.amount; }),
      approvedNotPaid: sum(expenses.filter(function (e) { return e.status === 'approved'; }),
        function (e) { return e.amount; })
    };
  }

  // ---------- history ----------
  function nameOf(profilesById, id) {
    return profilesById[id] ? profilesById[id].full_name : 'Неизвестно';
  }
  function buildTransactions(settings, contributions, expenses, profilesById) {
    var rows = [];
    if (settings.setup_done) {
      rows.push({
        kind: 'opening', date: settings.start_date, ts: '', amount: settings.opening_balance || 0,
        label: 'Начальный баланс', who: '', sign: 1, id: 0
      });
    }
    contributions.filter(function (c) { return c.status === 'approved'; }).forEach(function (c) {
      rows.push({
        kind: 'contribution', date: c.transfer_date, ts: c.reviewed_at || '', amount: c.amount,
        label: 'Взнос', who: nameOf(profilesById, c.member_id), memberId: c.member_id, sign: 1, id: c.id,
        checkedBy: nameOf(profilesById, c.reviewed_by), checkedAt: c.reviewed_at, note: c.note || ''
      });
    });
    expenses.filter(function (e) { return e.status === 'paid'; }).forEach(function (e) {
      rows.push({
        kind: 'expense', date: e.paid_at ? localDate(e.paid_at) : (e.created_at ? localDate(e.created_at) : settings.start_date), ts: e.paid_at || '', amount: e.amount,
        label: e.description, who: nameOf(profilesById, e.requested_by), sign: -1, id: e.id,
        checkedBy: nameOf(profilesById, e.paid_by), checkedAt: e.paid_at
      });
    });
    rows.sort(function (a, b) {
      if (a.kind === 'opening' && b.kind !== 'opening') return -1;
      if (b.kind === 'opening' && a.kind !== 'opening') return 1;
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      if (a.ts !== b.ts) return a.ts < b.ts ? -1 : 1;
      return a.id - b.id;
    });
    var running = 0;
    rows.forEach(function (r) { running += r.sign * r.amount; r.balanceAfter = running; });
    return rows;
  }

  // ---------- monthly report ----------
  function monthEnd(ym) {
    var p = ym.split('-').map(Number);
    var next = p[1] === 12 ? (p[0] + 1) + '-01-01' : p[0] + '-' + pad(p[1] + 1) + '-01';
    return addDays(next, -1);
  }
  function monthlyReport(ym, settings, contributions, expenses, profiles, todayStr) {
    var start = ym + '-01', end = monthEnd(ym);
    var byId = {};
    profiles.forEach(function (p) { byId[p.id] = p; });
    var tx = buildTransactions(settings, contributions, expenses, byId);

    var openingRow = tx.filter(function (t) { return t.kind === 'opening'; })[0];
    var startBalance = 0;
    if (openingRow && openingRow.date <= end) startBalance += openingRow.amount;
    var inside = [];
    tx.forEach(function (t) {
      if (t.kind === 'opening') return;
      if (t.date < start) startBalance += t.sign * t.amount;
      else if (t.date <= end) inside.push(t);
    });
    var moneyIn = sum(inside.filter(function (t) { return t.sign > 0; }), function (t) { return t.amount; });
    var moneyOut = sum(inside.filter(function (t) { return t.sign < 0; }), function (t) { return t.amount; });

    var asOf = end < todayStr ? end : todayStr;
    var perMember = profiles.map(function (p) {
      var paid = sum(inside.filter(function (t) { return t.kind === 'contribution' && t.memberId === p.id; }),
        function (t) { return t.amount; });
      var debt = 0, missed = 0;
      if (settings.setup_done && asOf >= start) {
        var s = memberSummary(p.id, settings, contributions, asOf);
        debt = s.debt; missed = s.missedWeeks;
      }
      return { id: p.id, name: p.full_name, paid: paid, debt: debt, missedWeeks: missed };
    });

    return {
      month: ym, label: monthLabel(ym), startBalance: startBalance, moneyIn: moneyIn,
      moneyOut: moneyOut, endBalance: startBalance + moneyIn - moneyOut,
      transactions: inside, perMember: perMember,
      rejected: contributions.filter(function (c) {
        var rd = localDate(c.reviewed_at); return c.status === 'rejected' && rd && rd >= start && rd <= end;
      }).length,
      beforeStart: !!(openingRow && openingRow.date > end)
    };
  }

  // ---------- who may do what (same rules as the database) ----------
  function isAdmin(p) { return !!p && (p.role === 'main_admin' || p.role === 'assistant_admin'); }

  function canReviewContribution(me, c, profilesById) {
    if (!me || !c || c.status !== 'pending') return false;
    if (c.member_id === me.id) return false;                 // never your own
    var owner = profilesById[c.member_id];
    if (owner && owner.role === 'main_admin') return true;   // any other friend may check the main admin
    return isAdmin(me);
  }
  function expenseVotes(exp, votes) {
    var mine = votes.filter(function (v) { return v.expense_id === exp.id; });
    return {
      list: mine,
      approvals: mine.filter(function (v) { return v.vote === 'approve'; }).length,
      rejections: mine.filter(function (v) { return v.vote === 'reject'; }).length
    };
  }
  function canVote(me, exp, votes) {
    if (!me || exp.status !== 'voting' || exp.requested_by === me.id) return false;
    return !votes.some(function (v) { return v.expense_id === exp.id && v.voter_id === me.id; });
  }
  function canMarkPaid(me, exp) {
    return isAdmin(me) && exp.status === 'approved' && exp.requested_by !== me.id;
  }
  function canCancelExpense(me, exp) {
    return !!me && (exp.status === 'voting' || exp.status === 'approved') &&
      (exp.requested_by === me.id || isAdmin(me));
  }

  // ---------- reminders shown inside the app ----------
  function reminders(ctx) {
    var out = [];
    var me = ctx.me, s = ctx.settings, t = ctx.today;
    if (!s.setup_done) {
      out.push({
        level: 'warn', tab: 'home',
        text: me.role === 'main_admin' ? 'Завершите настройку (начальный баланс и дата начала).'
          : 'Ждём, пока главный администратор завершит настройку.'
      });
      return out;
    }
    var mine = ctx.summaries[me.id];
    if (mine) {
      if (mine.debt > 0) {
        out.push({
          level: 'danger', tab: 'payments',
          text: 'Просрочено: ' + mine.missedWeeks + ' ' + plural(mine.missedWeeks, 'неделя', 'недели', 'недель') +
            '. К оплате: ' + formatKGS(mine.debt) + '.'
        });
      }
      if (mine.current.remaining > 0) {
        var left = daysBetween(t, mine.nextDeadline);
        if (left === 0) {
          out.push({ kind: 'deadline', level: 'warn', tab: 'payments', text: 'Сегодня срок оплаты. За эту неделю осталось внести: ' + formatKGS(mine.current.remaining) + '.' });
        } else if (left === 1) {
          out.push({ kind: 'deadline', level: 'warn', tab: 'payments', text: 'Завтра срок оплаты (' + prettyDate(mine.nextDeadline, true) + '): ' + formatKGS(mine.current.remaining) + '.' });
        } else {
          out.push({ kind: 'deadline', level: 'info', tab: 'payments', text: 'Ближайший срок: ' + prettyDate(mine.nextDeadline, true) + ' (через ' + left + ' ' + plural(left, 'день', 'дня', 'дней') + '). За эту неделю: ' + formatKGS(mine.current.remaining) + '.' });
        }
      }
    }
    var byId = ctx.profilesById;
    var pendingMine = ctx.contributions.filter(function (c) { return c.status === 'pending' && c.member_id === me.id; }).length;
    if (pendingMine) out.push({ level: 'info', tab: 'payments', text: 'Ваши платежи ждут проверки: ' + pendingMine + '.' });
    var toReview = ctx.contributions.filter(function (c) { return canReviewContribution(me, c, byId); }).length;
    if (toReview) out.push({ level: 'action', tab: 'payments', text: 'Платежей ждут вашей проверки в Simbank: ' + toReview + '.' });
    var toVote = ctx.expenses.filter(function (e) { return canVote(me, e, ctx.votes); }).length;
    if (toVote) out.push({ level: 'action', tab: 'expenses', text: 'Запросов на расход ждут вашего голоса: ' + toVote + '.' });
    var toPay = ctx.expenses.filter(function (e) { return canMarkPaid(me, e); }).length;
    if (toPay) out.push({ level: 'action', tab: 'expenses', text: 'Одобренных расходов ждут отметки об оплате: ' + toPay + '.' });
    return out;
  }

  // ---------- files ----------
  function toCSV(headers, rows) {
    function cell(v) {
      var s = v === null || v === undefined ? '' : String(v);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    return [headers].concat(rows).map(function (r) { return r.map(cell).join(','); }).join('\r\n');
  }

  return {
    TZ: TZ, VOTES_NEEDED: VOTES_NEEDED,
    addDays: addDays, dayOfWeek: dayOfWeek, daysBetween: daysBetween, localDate: localDate, today: today,
    prettyDate: prettyDate, prettyDateTime: prettyDateTime, monthLabel: monthLabel, monthEnd: monthEnd,
    formatKGS: formatKGS, plural: plural, firstDeadline: firstDeadline, deadlinesUpTo: deadlinesUpTo,
    memberSummary: memberSummary, balanceInfo: balanceInfo, buildTransactions: buildTransactions,
    monthlyReport: monthlyReport, isAdmin: isAdmin, canReviewContribution: canReviewContribution,
    expenseVotes: expenseVotes, canVote: canVote, canMarkPaid: canMarkPaid,
    canCancelExpense: canCancelExpense, reminders: reminders, toCSV: toCSV
  };
});

/*
 * Common Wallet - data layer for the website version.
 * Talks to the Supabase database. Every rule is checked again by the database
 * functions (supabase.sql), so the page cannot break the rules.
 */
(function () {
  'use strict';
  var SUPABASE_URL = 'https://pdzflfmjtawmfbdxqozu.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_5tSrl6PN0M2Al46by65ohg_04JgOzpA';
  var TOKEN_KEY = 'koshelek_token';

  var token = null, changeCb = null, statusCb = null, pollTimer = null;
  var POLL_MS = 15000;

  // The login is kept in two places (localStorage and IndexedDB), so it survives
  // closing the site; if one of them is wiped, the other one brings it back.
  function idb(mode, fn) {
    return new Promise(function (resolve) {
      try {
        var req = indexedDB.open('koshelek', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
        req.onerror = function () { resolve(null); };
        req.onsuccess = function () {
          try {
            var db = req.result, tx = db.transaction('kv', mode), r = fn(tx.objectStore('kv'));
            tx.oncomplete = function () { resolve(r && r.result !== undefined ? r.result : null); db.close(); };
            tx.onerror = tx.onabort = function () { resolve(null); db.close(); };
          } catch (e) { resolve(null); }
        };
      } catch (e) { resolve(null); }
    });
  }
  function withTimeout(p, ms) { return Promise.race([p, new Promise(function (r) { setTimeout(function () { r(null); }, ms); })]); }
  function goodToken(t) { return typeof t === 'string' && /^[0-9a-f]{64}$/.test(t) ? t : null; }
  async function readToken() {
    var t = null;
    try { t = goodToken(localStorage.getItem(TOKEN_KEY)); } catch (e) { }
    if (!t) t = goodToken(await withTimeout(idb('readonly', function (st) { return st.get('token'); }), 1500));
    if (t) writeToken(t);
    return t;
  }
  function writeToken(t) {
    token = t || null;
    try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) { }
    idb('readwrite', function (st) { return t ? st.put(t, 'token') : st.delete('token'); });
  }

  async function call(fn, args) {
    var headers = { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY };
    if (SUPABASE_KEY.indexOf('sb_') !== 0) headers.Authorization = 'Bearer ' + SUPABASE_KEY;
    var res, text;
    try {
      res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
        method: 'POST', headers: headers, body: JSON.stringify(args || {}), cache: 'no-store'
      });
      text = await res.text();
    } catch (e) {
      var off = new Error('Нет связи с интернетом. Проверьте подключение и попробуйте ещё раз.');
      off.offline = true;
      throw off;
    }
    var body = null;
    if (text) { try { body = JSON.parse(text); } catch (e) { body = null; } }
    if (!res.ok) {
      var msg;

      else msg = 'Ошибка сервера (' + res.status + '). Попробуйте ещё раз.' + (body && body.message ? ' [' + body.message + ']' : '');
      var err = new Error(msg);
      if (body && body.hint === 'login') err.needLogin = true;
      throw err;
    }

  }

  function poll() {
    if (!changeCb || document.visibilityState === 'hidden') return;
    changeCb();
  }

  window.API = {
    init: async function () {
      token = await readToken();
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { }); } catch (e) { }
    },
    chat: function (known) { return call('wallet_chat', { p_token: token, p_known: known || '' }); },
    hasToken: function () { return !!token; },
    status: function () { return call('wallet_status', {}); },
    register: async function (login, password, name) {
      var r = await call('wallet_register', { p_login: login, p_password: password, p_name: name });
      writeToken(r.token);
    },
    login: async function (login, password) {
      var r = await call('wallet_login', { p_login: login, p_password: password });
      if (r && r.error) throw new Error(r.error);
      writeToken(r.token);
    },
    logout: async function () {
      var t = token;
      writeToken(null);
      try { await call('wallet_logout', { p_token: t }); } catch (e) { }
    },
    forget: function () { writeToken(null); },
    loadAll: async function () {
      if (!token) { var e = new Error('Войдите в кошелёк.'); e.needLogin = true; throw e; }
      return call('wallet_state', { p_token: token });
    },
    rpc: async function (name, args) {
      await call('wallet_' + name, Object.assign({ p_token: token }, args || {}));
      return null;
    },
    rpcGet: async function (name, args) {
      return await call('wallet_' + name, Object.assign({ p_token: token }, args || {}));
    },
    subscribe: function (onChange, onStatus) {
      changeCb = onChange; statusCb = onStatus || null;
      clearInterval(pollTimer);
      pollTimer = setInterval(poll, POLL_MS);
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') poll(); });
      window.addEventListener('online', poll);
    },
    setLive: function (ok) { if (statusCb) statusCb(ok); },
    saveFile: async function (filename, text) {
      var type = /\.csv$/.test(filename) ? 'text/csv;charset=utf-8' : 'application/json;charset=utf-8';
      var blob = new Blob([text], { type: type });
      try {
        var file = new File([blob], filename, { type: type });

          }

    }
  };

  function chatListHtml(c) {
    var list = S.chat.messages;
    if (!list.length) return '<div class="chat-empty">Здесь пока тихо.<br>Напишите первое сообщение друзьям.</div>';
    var h = '', lastDay = '', prev = null, isMain = c.me.role === 'main_admin';
    list.forEach(function (m) {
      var day = CW.localDate(m.created_at);
      if (day !== lastDay) { h += '<div class="chat-day"><span>' + dayLabel(day, c.today) + '</span></div>'; lastDay = day; prev = null; }
      var mine = m.member_id === c.me.id;
      var cont = prev && prev.member_id === m.member_id && (new Date(m.created_at) - new Date(prev.created_at)) < 5 * 60000;
      var canDel = !m.deleted && (mine || isMain);
      var isStk = !m.deleted && /^§st:[a-z]+$/.test(m.body || '') && '<span class="muted">Стикер</span>';
      var gm = !m.deleted && /^§gif:[A-Za-z0-9]+$/.exec(m.body || '');
      if (gm) isStk = '<img class="gifmsg" loading="lazy" alt="GIF" src="https://media.giphy.com/media/' + gm[0].slice(5) + '/200w.gif">';
      var body = m.deleted ? '<span class="gone">Сообщение удалено</span>' : (isStk || mentionHtml(m.body));
      var tome = !m.deleted && !mine && mentionsMe(m.body);
      var bubble = '<' + (canDel ? 'button data-act="msg-menu" data-id="' + m.id + '"' : 'div') + ' class="bubble' + (isStk ? ' stk-b' : '') + (m.deleted ? ' deleted' : '') + (tome ? ' tome' : '') + '">' +
        body + '<span class="t">' + timeOnly(m.created_at) + '</span></' + (canDel ? 'button' : 'div') + '>';
      bubble += m.deleted ? '' : reactionsHtml(m);
      if (mine) h += '<div class="brow me' + (cont ? ' cont' : '') + '"><div class="bcol meb">' + bubble + '</div></div>';
      else {
        var idx = 0; c.d.profiles.forEach(function (q, k) { if (q.id === m.member_id) idx = k % 4; });
        h += '<div class="brow' + (cont ? ' cont' : '') + '">' + (cont ? '<span class="ava-gap"></span>' : ava(c, m.member_id, 'sm')) +
          '<div class="bcol">' + (cont ? '' : '<div class="bname n' + idx + '">' + esc(name(c, m.member_id)) + '</div>') + bubble + '</div></div>';
      }
      prev = m;
    });
    return h;
  }

  function markChatRead() {

  function updateChatBadges() {

  function updateChatList() {
    var el = document.getElementById('chat-list');
    if (!el || S.phase !== 'app' || !S.data) return;
    var nearEnd = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 160;
    el.innerHTML = chatListHtml(derive());
    if (nearEnd || S.chatToEnd) { scrollChatEnd(); S.chatToEnd = false; }

  var chatLoading = false;
  async function loadChat() {
    if (chatLoading || S.phase !== 'app') return;
    chatLoading = true;
    try {
      var r = await API.chat(S.chat.version);
      if (r && !r.unchanged) {
        S.chat.version = r.version;
        S.chat.messages = r.messages || [];
        if (S.tab === 'chat') { updateChatList(); markChatRead(); }
        updateChatBadges();
      }
    } catch (e) {
      if (e.needLogin) { API.forget(); await toLogin(); }
    } finally { chatLoading = false; }

  function statusLine(c) {

    if (todo) return 'Ждёт тебя: ' + todo;

  }
  function inboxHtml(c) {
    var items = [];
    c.toReview.forEach(function (x) {
      items.push(['<b>' + esc(firstName(c.byId[x.member_id] || { full_name: '?' })) + '</b> перевёл(а) ' + money(x.amount), 'проверь в Simbank', x.member_id, btn('Пришли', 'review', 'data-id="' + x.id + '" data-ok="1"', 'good')]);
    });
    c.toVote.forEach(function (e) {
      items.push(['<b>' + esc(firstName(c.byId[e.requested_by] || { full_name: '?' })) + '</b> просит ' + money(e.amount), esc(e.description), e.requested_by,

      items.push(['Оплатить: ' + money(e.amount), esc(e.description), e.requested_by, btn('Оплачено', 'paid', 'data-id="' + e.id + '"', 'good')]);

  function chartHtml(c) {
    var s = c.d.settings, tx = CW.buildTransactions(s, c.d.contributions, c.d.expenses, c.byId), pts = [], last = null;
    tx.forEach(function (t) { if (last && last.d === t.date) last.b = t.balanceAfter; else { last = { d: t.date, b: t.balanceAfter }; pts.push(last); } });
    if (!pts.length || pts[pts.length - 1].d < c.today) pts.push({ d: c.today, b: c.bal.confirmed });

    if (pts.length < 2) return h + '<p class="muted">График появится, когда пройдёт пара дней и будут платежи.</p></div>';
    var day = function (d) { return Date.parse(d + 'T00:00:00Z') / 864e5; };
    var x0 = day(pts[0].d), x1 = day(pts[pts.length - 1].d), g = c.d.goal;
    var maxB = Math.max.apply(null, pts.map(function (p) { return p.b; })), minB = Math.min(0, Math.min.apply(null, pts.map(function (p) { return p.b; })));

      (g ? '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(g.target).toFixed(1) + '" y2="' + Y(g.target).toFixed(1) + '"/><text x="' + L + '" y="' + (Y(g.target) - 3).toFixed(1) + '">цель ' + CW.formatKGS(g.target) + '</text>' : '') +

      '<circle cx="' + X(ep.d).toFixed(1) + '" cy="' + Y(ep.b).toFixed(1) + '" r="4" fill="#ec4899" stroke="#fff" stroke-width="1.5"/>' +
      '<text x="' + L + '" y="' + (H - 6) + '">' + CW.prettyDate(pts[0].d, false) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + CW.prettyDate(ep.d, false) + '</text></svg>' +

  // ----- popup
  function viewModal() {

  function openModal(m) { S.drafts['m-input'] = undefined; S.drafts['m-check'] = undefined; S.modal = m; render(); }
  function closeModal() { S.modal = null; S.drafts['m-input'] = undefined; S.drafts['m-check'] = undefined; render(); }

  // ---------------------------------------------------------------- drawing
  function render() {
    var active = document.activeElement, focusId = active && active.id, selStart = null, selEnd = null;
    try { if (active && active.selectionStart !== undefined) { selStart = active.selectionStart; selEnd = active.selectionEnd; } } catch (e) { }
    var scroll = window.scrollY, html;
    if (S.phase === 'boot') html = '';
    else if (S.phase === 'error') html = viewError();
    else if (S.phase === 'login') html = viewLogin();
    else if (S.phase === 'pending') html = viewPending();
    else if (S.phase === 'app' && !S.data) html = '<div class="login"><h1>PIPO</h1><p class="muted">Загрузка кошелька…</p></div>';
    else if (S.phase === 'app') {
      var c = derive();
      html = c.me ? viewShell(c) : '<div class="login"><h1>PIPO</h1><p class="muted">Загрузка кошелька…</p></div>';
    }
    ROOT.innerHTML = html;
    // put back what the person was typing
    Object.keys(S.drafts).forEach(function (id) {
      var el = document.getElementById(id), v = S.drafts[id];
      if (!el || v === undefined) return;
      if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
    });
    if (focusId) {
      var f = document.getElementById(focusId);
      if (f) { f.focus(); try { if (selStart !== null) f.setSelectionRange(selStart, selEnd); } catch (e) { } }
    }
    window.scrollTo(0, scroll);
    afterRender();
  }
  function afterRender() {
    var wasEnter = S.enter;

    callIdlePoll();
    try { var c0 = derive(); if (c0.me && c0.d.settings.setup_done && !S.modal) checkNewAch(c0); } catch (e0) { }
    if (S.tab === 'chat') {
      if (wasEnter || S.chatToEnd) { scrollChatEnd(); S.chatToEnd = false; }

    }

    var bal = document.querySelector('.simcard .bal');
    if (bal) {
      var to = derive().bal.confirmed, from = S.shownBal === null ? Math.max(0, to - Math.max(1000, Math.round(to * 0.25))) : S.shownBal;

        })(t0);
      }
    }
  }

  // ---------------------------------------------------------------- loading & actions
  var CACHE_KEY = 'koshelek_cache';
  function cacheSave(d) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) { } }
  function cacheLoad() { try { var j = localStorage.getItem(CACHE_KEY); return j ? JSON.parse(j) : null; } catch (e) { return null; } }
  function cacheClear() { try { localStorage.removeItem(CACHE_KEY); } catch (e) { } }
  function applyData(d) {
    var j = JSON.stringify(d), changed = j !== S.lastJson;
    S.lastJson = j;
    S.uid = d.me.id;
    if (d.me.status !== 'active') { S.phase = 'pending'; S.pendingMe = d.me; S.data = null; }
    else { S.phase = 'app'; S.pendingMe = null; d.settings.week_marks = d.week_marks || []; S.data = d; }
    return changed;
  }
  async function reload(silent) {
    try {
      var before = S.phase, d = await API.loadAll(), changed = applyData(d);
      cacheSave(d);
      if (!S.live) { S.live = true; changed = true; }
      if (changed || !silent || before !== S.phase) {
        // on the chat screen a background refresh must not redraw (it would close the keyboard)
        if (!(silent && before === S.phase && S.tab === 'chat' && document.getElementById('chat-list'))) render();
      }
      if (S.phase === 'app' && d.chat_version && d.chat_version !== S.chat.version) loadChat();
      if (S.phase === 'app' && !S.pushChecked) { S.pushChecked = true; refreshPush(); }
    } catch (e) {
      if (e.needLogin) { API.forget(); await toLogin(); if (!silent) toast(e.message, true); return; }
      if (e.offline && S.live) { S.live = false; render(); }
      if (!silent) toast(e.message, true);
    }
  }
  var reloadTimer = null;
  function reloadSoon() { clearTimeout(reloadTimer); reloadTimer = setTimeout(function () { reload(true); }, 350); }

  async function run(fn, okMessage) {
    if (S.busy) return false;
    S.busy = true;
    try { await fn(); await reload(); if (okMessage) toast(okMessage); return true; }
    catch (e) {
      if (e.needLogin) { API.forget(); await toLogin(); }
      toast(e.message, true); return false;
    }
    finally { S.busy = false; }
  }
  function clearDrafts(ids) { ids.forEach(function (i) { S.drafts[i] = undefined; }); }

  async function toLogin() {

    S.tab = 'home'; S.showChPass = false; S.enter = true; S.shownBal = null;

  async function boot() {
    setInterval(tickCountdown, 1000);

      if (S.phase === 'app' && S.tab === 'chat' && document.visibilityState === 'visible') loadChat();
    }, 3000);

    catch (e) {

      if (cached && cached.me) { applyData(cached); S.lastJson = ''; S.live = false; toast('Нет интернета. Показаны последние сохранённые данные.', true); return; }

        if (!e2) return;
        openModal({
          title: 'Отметить оплаченным?', confirm: 'Отметить', cls: 'good',
          body: '<p><b>' + money(e2.amount) + '</b> — ' + esc(e2.description) + '</p><p class="muted" style="margin-top:6px">Баланс уменьшится на эту сумму.</p>',
          check: 'Я открыл(а) Simbank и увидел(а), что этот платёж списан с карты.',
          input: { label: 'Заметка (необязательно)', placeholder: '' },
          action: function (note) { return run(function () { return API.rpc('mark_expense_paid', { p_id: e2.id, p_note: note }); }, 'Отмечено оплаченным. Баланс обновлён.'); }
        });
        break;
      }
      case 'cancelexp': {
        var e3 = c.d.expenses.filter(function (q) { return String(q.id) === id; })[0];
        if (!e3) return;
        openModal({
          title: 'Отменить этот запрос?', confirm: 'Отменить запрос', cls: 'bad',
          body: '<p>' + money(e3.amount) + ' — ' + esc(e3.description) + '</p>',
          action: function () { return run(function () { return API.rpc('cancel_expense', { p_id: e3.id }); }, 'Запрос отменён.'); }
        });
        break;
      }

      case 'csv-tx': {
        var tx = CW.buildTransactions(c.d.settings, c.d.contributions, c.d.expenses, c.byId);
        download('obshchiy-koshelek-dengi-' + c.today + '.csv', '﻿' + CW.toCSV(
          ['Дата', 'Тип', 'Описание', 'Кто', 'Проверил(а)', 'Сумма (сом)', 'Баланс после (сом)'],
          tx.map(function (r) { return [r.date, KIND_RU[r.kind] || r.kind, r.label, r.who, r.checkedBy || '', r.sign * r.amount, r.balanceAfter]; })), 'text/csv');
        break;
      }
      case 'csv-report': {
        var ym = t.getAttribute('data-month');
        var r = CW.monthlyReport(ym, c.d.settings, c.d.contributions, c.d.expenses, c.profiles, c.today);
        var rows = [['Баланс на начало', '', '', '', r.startBalance]]
          .concat(r.transactions.map(function (q) { return [q.date, q.label, q.who, q.checkedBy || '', q.sign * q.amount]; }))
          .concat([['Баланс на конец', '', '', '', r.endBalance]]);
        download('obshchiy-koshelek-otchet-' + ym + '.csv', '﻿' + CW.toCSV(['Дата', 'Описание', 'Кто', 'Проверил(а)', 'Сумма (сом)'], rows), 'text/csv');
        break;
      }
      case 'install':
        if (!installEvt) break;
        try { installEvt.prompt(); await installEvt.userChoice; } catch (e) { }
        installEvt = null; render();
        break;
      case 'backup':
        download('obshchiy-koshelek-kopiya-' + c.today + '.json', JSON.stringify({ saved_at: new Date().toISOString(), data: S.data }, null, 2));
        break;
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && S.modal) { ev.preventDefault(); closeModal(); }
  });

  // ---------------------------------------------------------------- install on Android / desktop
  var installEvt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); installEvt = e;
    if (S.phase === 'app' && S.tab === 'more') render();
  });
  window.addEventListener('appinstalled', function () { installEvt = null; toast('Кошелёк установлен.'); });

  // ---------------------------------------------------------------- start
  document.addEventListener('change', function (ev) {
    var f = ev.target && ev.target.id === 'ph-file' && ev.target.files && ev.target.files[0];
    if (!f) return;
    ev.target.value = '';
    if (!/^image\//.test(f.type || 'image/')) { toast('Это не фото. Выберите картинку.', true); return; }
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () {
      var sz = 160, cv = document.createElement('canvas'); cv.width = cv.height = sz;
      var ctx = cv.getContext('2d'), m = Math.min(img.width, img.height), sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, sz, sz); ctx.drawImage(img, sx, sy, m, m, 0, 0, sz, sz);
      URL.revokeObjectURL(url);
      var data = cv.toDataURL('image/jpeg', 0.82);
      run(function () { return API.rpc('set_avatar', { p_avatar: data }); }, 'Фото сохранено.');
    };
    img.onerror = function () { URL.revokeObjectURL(url); toast('Не удалось открыть это фото. Выберите другое.', true); };
    img.src = url;
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }
  applyPrefs();
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyPrefs); } catch (e) { }
  var splash = document.getElementById('splash');
  var skip = /[?&]nosplash/.test(location.search);
  var appReady = false, videoDone = false, started = Date.now();
  function maybeHide() { if (appReady && videoDone) splash.classList.add('gone'); }
  if (skip) { splash.classList.add('gone'); videoDone = true; }
  else {
    var vid = splash.querySelector('video');
    var wide = (window.innerWidth / window.innerHeight) > 0.6;
    var ext = (vid.canPlayType && vid.canPlayType('video/mp4; codecs="avc1.640028"')) ? 'mp4' : 'webm';
    vid.src = 'splash-' + (wide ? 'wide' : 'phone') + '.' + ext;
    var played = false;
    var fallback = function () {
      if (played) return;
      splash.classList.add('nov');
      setTimeout(function () { videoDone = true; maybeHide(); }, 1400);
    };
    try {
      vid.addEventListener('playing', function () { played = true; splash.classList.add('vid'); });
      vid.addEventListener('ended', function () { videoDone = true; maybeHide(); });
      vid.addEventListener('error', function () { setTimeout(fallback, 0); }, true);
      var pr = vid.play(); if (pr && pr.catch) pr.catch(function () { });
    } catch (e) { fallback(); }
    setTimeout(fallback, 900);
    setTimeout(function () { videoDone = true; maybeHide(); }, 6000);
  }
  boot().then(function () {
    render();
    appReady = true; maybeHide();
  });
})();

</script>
