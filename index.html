<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIPO</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PIPO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e9e4f7">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root { color-scheme: light; }
:root {
  --lake: #0e3b5c;
  --lake-deep: #082a43;
  --lake-soft: #e6eef4;
  --snow: #f4f7f9;
  --paper: #ffffff;
  --ink: #14232e;
  --ink-soft: #5a6b78;
  --line: #dbe3e9;
  --saffron: #f0a43a;
  --saffron-deep: #b9700a;
  --good: #1b7a4b;
  --good-bg: #e0f3e8;
  --warn-bg: #fff1d6;
  --bad: #b3261e;
  --bad-bg: #fbe4e1;
  --info-bg: #e3eef8;
  --radius: 14px;
  --nav-h: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--snow); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- welcome screen ---------- */
#splash {
  position: fixed; inset: 0; z-index: 50; background: var(--lake-deep); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  transition: opacity .5s ease, visibility .5s;
}
#splash.gone { opacity: 0; visibility: hidden; }
#splash .hello { font: 600 56px/1 Georgia, "Times New Roman", serif; letter-spacing: .01em; }
#splash .app { color: #b9cfe0; font-size: 15px; }
#splash .bar { width: 120px; height: 3px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; margin-top: 18px; }
#splash .bar i { display: block; height: 100%; width: 100%; background: var(--saffron); transform-origin: left; animation: fill 2.2s linear forwards; }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ---------- layout ---------- */
#app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(var(--nav-h) + 28px); min-height: 100vh; min-height: 100dvh; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 10px; }
.topbar .brand { font: 700 18px Georgia, serif; color: var(--lake); }
.topbar .who { font-size: 14px; color: var(--ink-soft); text-align: right; }
.topbar .who b { color: var(--ink); font-weight: 600; }
.sync { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; }
.sync.off { background: var(--saffron); }

h2 { font-size: 19px; margin: 24px 0 10px; color: var(--lake-deep); }
h3 { font-size: 16px; margin: 0 0 6px; }
.muted { color: var(--ink-soft); font-size: 14px; }
.small { font-size: 13px; }
section.block { margin-top: 6px; }

.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.panel.tight { padding: 0; overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row.top { align-items: flex-start; }
.stack > * + * { margin-top: 10px; }
.list > .item { padding: 12px 14px; border-top: 1px solid var(--line); }
.list > .item:first-child { border-top: 0; }
.empty { padding: 18px 14px; color: var(--ink-soft); text-align: center; font-size: 15px; }

/* ---------- the card ---------- */
.simcard {
  position: relative; overflow: hidden; color: #fff; border-radius: 20px; padding: 20px 20px 18px;
  min-height: 196px; display: flex; flex-direction: column; justify-content: space-between;
  background: linear-gradient(135deg, #0e3b5c 0%, #0a2f4b 55%, #082a43 100%);
  box-shadow: 0 14px 28px rgba(8, 42, 67, .28);
}
.simcard::before {   /* felt-rug style pattern, drawn by us */
  content: ""; position: absolute; right: -40px; top: -30px; width: 260px; height: 260px; opacity: .22;
  background:
    conic-gradient(from 45deg at 50% 50%, var(--saffron) 0 25%, transparent 0 50%, var(--saffron) 0 75%, transparent 0) 0 0 / 52px 52px;
  -webkit-mask: radial-gradient(circle at 60% 40%, #000 0 38%, transparent 72%);
          mask: radial-gradient(circle at 60% 40%, #000 0 38%, transparent 72%);
}
.simcard::after {
  content: ""; position: absolute; inset: 0; border-radius: 20px; pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
}
.simcard > * { position: relative; z-index: 1; }
.simcard .top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #c3d6e5; }
.simcard .chip { width: 38px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, #f7d58e, #d9953a); margin-top: 12px; }
.simcard .lbl { font-size: 13px; color: #b9cfe0; margin-top: 14px; }
.simcard .bal { font: 700 38px/1.1 Georgia, serif; letter-spacing: .01em; }
.simcard .bottom { font-size: 13px; color: #b9cfe0; display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
.card-notes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.note-chip { background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 13px; color: var(--ink-soft); }
.note-chip b { color: var(--ink); }

/* ---------- messages ---------- */
.msg { border-radius: 12px; padding: 11px 13px; font-size: 15px; margin-bottom: 8px; display: block; width: 100%; text-align: left; border: 0; }
.msg.info { background: var(--info-bg); }
.msg.warn { background: var(--warn-bg); }
.msg.danger { background: var(--bad-bg); color: #6d1712; }
.msg.action { background: var(--lake); color: #fff; }
button.msg { cursor: pointer; }

/* ---------- chips ---------- */
.chip-s { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.chip-s.paid { background: var(--good-bg); color: var(--good); }
.chip-s.paid_late { background: #e7efd4; color: #53701a; }
.chip-s.partial { background: var(--warn-bg); color: var(--saffron-deep); }
.chip-s.overdue, .chip-s.rejected { background: var(--bad-bg); color: var(--bad); }
.chip-s.due, .chip-s.pending, .chip-s.voting { background: var(--info-bg); color: var(--lake); }
.chip-s.approved { background: var(--good-bg); color: var(--good); }
.chip-s.cancelled { background: #eceff2; color: var(--ink-soft); }
.role { font-size: 12px; color: var(--ink-soft); }

/* ---------- forms & buttons ---------- */
label { display: block; font-size: 14px; font-weight: 600; margin: 10px 0 4px; }
input, select, textarea {
  width: 100%; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; min-height: 46px;
}
input:focus, select:focus, textarea:focus, button:focus-visible, .seg button:focus-visible {
  outline: 3px solid rgba(240, 164, 58, .55); outline-offset: 1px; border-color: var(--saffron-deep);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 18px;
  border-radius: 10px; border: 0; background: var(--lake); color: #fff; font-weight: 600; cursor: pointer;
}
.btn:active { transform: translateY(1px); }
.btn.full { width: 100%; margin-top: 14px; }
.btn.ghost { background: transparent; color: var(--lake); border: 1.5px solid var(--lake); }
.btn.good { background: var(--good); }
.btn.bad { background: var(--bad); }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 15px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btns .btn { flex: 1; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; font-size: 15px; margin-top: 12px; }
.check input { width: 22px; height: 22px; min-height: 22px; margin-top: 2px; flex: none; }

.seg { display: flex; background: #e9eef2; border-radius: 12px; padding: 3px; gap: 3px; margin: 14px 0 10px; overflow-x: auto; }
.seg button { flex: 1; min-height: 40px; border: 0; background: transparent; border-radius: 9px; font-weight: 600; color: var(--ink-soft); cursor: pointer; white-space: nowrap; padding: 0 12px; }
.seg button.on { background: #fff; color: var(--lake-deep); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* ---------- progress ---------- */
.bar { height: 10px; background: #e6ecf0; border-radius: 10px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--saffron); border-radius: 10px; }
.bar > i.full { background: var(--good); }
.big { font: 700 26px/1.15 Georgia, serif; color: var(--lake-deep); }
.bad-text { color: var(--bad); font-weight: 600; }
.good-text { color: var(--good); font-weight: 600; }
.plus { color: var(--good); font-weight: 700; }
.minus { color: var(--bad); font-weight: 700; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 15px; }
.kv dt { color: var(--ink-soft); } .kv dd { margin: 0; text-align: right; font-weight: 600; }
.kv .total { border-top: 1px solid var(--line); padding-top: 6px; }
.voters { font-size: 14px; color: var(--ink-soft); margin-top: 6px; }

/* ---------- bottom navigation ---------- */
nav.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom); background: #fff; border-top: 1px solid var(--line);
  display: flex; justify-content: center;
}
nav.bottom .inner { display: flex; width: 100%; max-width: 560px; }
nav.bottom button {
  flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; font-size: 12px; color: var(--ink-soft); cursor: pointer; position: relative; min-height: var(--nav-h);
}
nav.bottom button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.bottom button.on { color: var(--lake); font-weight: 700; }
nav.bottom button.on::before { content: ""; position: absolute; top: 0; width: 34px; height: 3px; background: var(--saffron); border-radius: 0 0 3px 3px; }
nav.bottom .badge {
  position: absolute; top: 7px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}

/* ---------- popup ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 40; background: rgba(8, 42, 67, .55); display: flex; align-items: flex-end; justify-content: center; }
.modal { background: #fff; width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 20px 18px calc(22px + env(safe-area-inset-bottom)); max-height: 90vh; overflow: auto; }
.modal h3 { font-size: 19px; margin-bottom: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px); transform: translateX(-50%); z-index: 60; background: var(--lake-deep); color: #fff; padding: 11px 16px; border-radius: 12px; max-width: min(92vw, 520px); font-size: 15px; box-shadow: 0 8px 22px rgba(0,0,0,.25); }
.toast.err { background: var(--bad); }

.login { max-width: 420px; margin: 0 auto; padding: 56px 20px; }
.login h1 { font: 700 34px Georgia, serif; color: var(--lake-deep); margin-bottom: 6px; }
.errtext { color: var(--bad); font-size: 14px; margin-top: 10px; }
a { color: var(--lake); }

@media print {
  nav.bottom, .topbar, .seg, .noprint, #splash, .toast { display: none !important; }
  body { background: #fff; } #app { padding: 0; max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  #splash .bar i { animation: none; transform: none; }
  #splash { transition: none; }
}

/* ================= яркая тема ================= */
:root {
  --lake: #5b2bd9; --lake-deep: #2a1470; --lake-soft: #efe9ff;
  --snow: #f3efff; --line: #e1d8fb; --ink: #1d1340; --ink-soft: #6a5f93;
  --saffron: #ffb020; --saffron-deep: #c25e00;
  --good: #0a9b62; --good-bg: #d6f7e8; --warn-bg: #fff0c9;
  --bad: #e0245e; --bad-bg: #ffe0ea; --info-bg: #e2e9ff;
  --pink: #ff3d8b; --cyan: #12c2e9; --violet: #7c3aed;
}
body { background: linear-gradient(180deg, #ede4ff 0%, #f7f2ff 220px, #f3efff 100%) fixed; }
#splash { background: linear-gradient(145deg, #2a1470 0%, #5b2bd9 45%, #ff3d8b 100%); }
#splash .app { color: #ffe6f1; }
#splash .bar i { background: #fff; }
.topbar .brand { background: linear-gradient(90deg, #5b2bd9, #ff3d8b); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 20px; }
h2 { color: var(--lake-deep); display: flex; align-items: center; gap: 8px; }
h2::before { content: ""; width: 6px; height: 20px; border-radius: 4px; background: linear-gradient(180deg, var(--pink), var(--violet)); }
.simcard {
  background: linear-gradient(135deg, #6a2cf0 0%, #b02fd6 48%, #ff3d8b 100%);
  box-shadow: 0 16px 34px rgba(124, 58, 237, .38);
}
.simcard::before { opacity: .28; background: conic-gradient(from 45deg at 50% 50%, #12c2e9 0 25%, transparent 0 50%, #ffb020 0 75%, transparent 0) 0 0 / 52px 52px;
  -webkit-mask: radial-gradient(circle at 60% 40%, #000 0 38%, transparent 72%); mask: radial-gradient(circle at 60% 40%, #000 0 38%, transparent 72%); }
.simcard .top, .simcard .lbl, .simcard .bottom { color: #ffe9f4; }
.panel { border: 0; box-shadow: 0 4px 14px rgba(91, 43, 217, .10); border-left: 5px solid var(--violet); }
.panel.tight { border-left-color: var(--cyan); }
.panel.empty { border-left-color: var(--saffron); }
.note-chip { border: 0; background: #fff; box-shadow: 0 2px 8px rgba(91,43,217,.10); }
.msg.info { background: var(--info-bg); border-left: 5px solid #4f6bff; }
.msg.warn { background: var(--warn-bg); border-left: 5px solid var(--saffron); }
.msg.danger { background: var(--bad-bg); border-left: 5px solid var(--bad); }
.msg.action { background: linear-gradient(90deg, #5b2bd9, #ff3d8b); color: #fff; }
.btn { background: linear-gradient(135deg, #6a2cf0, #9b35e0); box-shadow: 0 4px 12px rgba(106, 44, 240, .30); }
.btn.good { background: linear-gradient(135deg, #0a9b62, #12c2a0); box-shadow: 0 4px 12px rgba(10,155,98,.28); }
.btn.bad { background: linear-gradient(135deg, #e0245e, #ff5a7a); box-shadow: 0 4px 12px rgba(224,36,94,.28); }
.btn.ghost { background: #fff; color: var(--violet); border-color: var(--violet); box-shadow: none; }
.seg { background: #e4dafc; }
.seg button.on { background: linear-gradient(135deg, #6a2cf0, #b02fd6); color: #fff; box-shadow: 0 2px 8px rgba(106,44,240,.35); }
.bar > i { background: linear-gradient(90deg, #ffb020, #ff3d8b); }
.bar > i.full { background: linear-gradient(90deg, #0a9b62, #12c2e9); }
.big { color: var(--violet); }
.chip-s.due, .chip-s.pending, .chip-s.voting { background: #e2e9ff; color: #3b4fd6; }
.chip-s.partial { color: #b85c00; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid rgba(124,58,237,.35); border-color: var(--violet); }
.plus { color: var(--good); font-weight: 700; }
.minus { color: var(--bad); font-weight: 700; }
nav.bottom { box-shadow: 0 -6px 20px rgba(91,43,217,.14); border-top: 0; }
nav.bottom button.on::before { background: linear-gradient(90deg, #ff3d8b, #7c3aed); height: 4px; }
nav.bottom .badge { background: var(--pink); }
.modal-bg { background: rgba(42, 20, 112, .6); }
.login h1 { background: linear-gradient(90deg, #5b2bd9, #ff3d8b); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ================= сайт: вход, заявки, экран «Домой» ================= */
.topbar { padding-top: calc(16px + env(safe-area-inset-top)); }
.login { padding-top: calc(48px + env(safe-area-inset-top)); padding-bottom: 40px; }
.login .seg { margin-top: 18px; }
.linkbox { word-break: break-all; background: var(--lake-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 8px; }
.tip { margin-top: 18px; }
.item .btns { margin-top: 8px; }

/* ================= v2: аватарки, быстрые кнопки, отсчёт, чат ================= */
.me-box { display: flex; align-items: center; gap: 10px; }
.ava { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none;
  color: #fff; font-weight: 800; font-size: 17px; box-shadow: 0 3px 8px rgba(91,43,217,.22); }
.ava.md { width: 38px; height: 38px; font-size: 16px; }
.ava.sm { width: 30px; height: 30px; font-size: 13px; box-shadow: none; }
.ava.xs { width: 20px; height: 20px; font-size: 11px; box-shadow: none; margin-right: 6px; }
.ava.c0 { background: linear-gradient(135deg, #6a2cf0, #9b35e0); }
.ava.c1 { background: linear-gradient(135deg, #ff3d8b, #ff7a59); }
.ava.c2 { background: linear-gradient(135deg, #12c2e9, #3b82f6); }
.ava.c3 { background: linear-gradient(135deg, #0a9b62, #2fd3a0); }
.item.member { display: flex; gap: 12px; align-items: flex-start; }
.item.member > .ava { margin-top: 1px; }
.grow { flex: 1; min-width: 0; }
.bar.thin { height: 6px; margin-top: 9px; background: #efe9ff; }
.asker { display: flex; align-items: center; flex-wrap: wrap; }
.badge[hidden], .qb[hidden] { display: none !important; }

.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0 2px; }
.quick button { border: 0; background: #fff; border-radius: 18px; padding: 12px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 600; color: var(--lake-deep); box-shadow: 0 4px 14px rgba(91,43,217,.10); cursor: pointer; transition: transform .12s ease; }
.quick button:active { transform: scale(.94); }
.quick .qi { position: relative; width: 44px; height: 44px; border-radius: 15px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #efe7ff, #e4dafc); color: var(--violet); }
.quick button:nth-child(2) .qi { background: linear-gradient(135deg, #ffe3ef, #ffd6e4); color: var(--pink); }
.quick button:nth-child(3) .qi { background: linear-gradient(135deg, #dff6fd, #d3ecff); color: #1593c4; }
.quick button:nth-child(4) .qi { background: linear-gradient(135deg, #dcf7ea, #ccf2e2); color: var(--good); }
.quick svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.qb { position: absolute; top: -6px; right: -9px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--pink);
  color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }

.countdown { display: block; width: 100%; border: 0; text-align: left; cursor: pointer; color: #fff; border-radius: 22px; padding: 16px 16px 14px;
  margin-bottom: 10px; position: relative; overflow: hidden; font: inherit;
  background: linear-gradient(135deg, #2a1470 0%, #5b2bd9 55%, #8b3df0 100%); box-shadow: 0 12px 26px rgba(91,43,217,.30); }
.countdown::after { content: ""; position: absolute; right: -50px; top: -60px; width: 170px; height: 170px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.20), transparent 70%); pointer-events: none; }
.countdown.soon { background: linear-gradient(135deg, #b5134f 0%, #ff3d8b 55%, #ff8a3d 100%); box-shadow: 0 12px 26px rgba(255,61,139,.32); }
.countdown.late { background: linear-gradient(135deg, #7d0b33 0%, #e0245e 60%, #ff5a7a 100%); box-shadow: 0 12px 26px rgba(224,36,94,.30); }
.countdown.paid { background: linear-gradient(135deg, #064e3b 0%, #0a9b62 55%, #12c2a0 100%); box-shadow: 0 12px 26px rgba(10,155,98,.28); }
.countdown > span { display: block; position: relative; z-index: 1; }
.cd-head { display: flex !important; justify-content: space-between; gap: 10px; font-size: 14px; }
.cd-head > span:first-child { opacity: .9; }
.cd-date { font-weight: 700; }
.cd-digits { display: flex !important; align-items: flex-start; gap: 4px; margin: 12px 0; }
.cd-digits i { font-style: normal; font-size: 24px; font-weight: 800; opacity: .55; padding-top: 8px; }
.cd-cell { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
.cd-cell b { display: block; width: 100%; text-align: center; font: 800 32px/1.15 system-ui, -apple-system, "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums; background: rgba(255,255,255,.16); border-radius: 14px; padding: 6px 0; }
.cd-cell small { font-size: 12px; opacity: .85; margin-top: 5px; }
.cd-foot { font-size: 14px; background: rgba(255,255,255,.15); border-radius: 12px; padding: 8px 11px; }

.cdl { display: block; width: 100%; border: 0; text-align: left; cursor: pointer; border-radius: 16px; padding: 11px 14px 12px; background: #fff; box-shadow: 0 4px 14px rgba(40,40,90,.10); margin: 6px 0 10px; font: inherit; color: inherit; }

.cdl.warn .cdl-bar i { background: #f5b400; }
.cdl.soon .cdl-bar i { background: #ff7a1a; }
.cdl.late .cdl-bar i { background: #e0245e; }
.cdl.paid .cdl-bar i { background: #12b76a; }
.wk-act { margin-top: 6px; }
.btn.small { padding: 6px 12px; font-size: 13px; border-radius: 10px; }

@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
#app.enter > *:not(.topbar) { animation: rise .42s cubic-bezier(.2,.75,.25,1) both; }
#app.enter > *:nth-child(3) { animation-delay: .04s; } #app.enter > *:nth-child(4) { animation-delay: .08s; }
#app.enter > *:nth-child(5) { animation-delay: .12s; } #app.enter > *:nth-child(6) { animation-delay: .16s; }
#app.enter > *:nth-child(7) { animation-delay: .20s; } #app.enter > *:nth-child(n+8) { animation-delay: .24s; }
@media (prefers-reduced-motion: reduce) { #app.enter > * { animation: none !important; } }

/* чат */

.chat { display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 6px; flex: 1; }
.chat-empty { margin: auto 0; }
.item.member .btn.sm { white-space: nowrap; flex: none; }
.chat-empty { text-align: center; color: var(--ink-soft); padding: 46px 12px; background: #fff; border-radius: 20px; box-shadow: 0 4px 14px rgba(91,43,217,.08); line-height: 1.6; }
.chat-day { text-align: center; margin: 14px 0 6px; }
.chat-day span { font-size: 12px; font-weight: 700; color: var(--ink-soft); background: rgba(255,255,255,.9); padding: 4px 11px; border-radius: 999px; box-shadow: 0 2px 6px rgba(91,43,217,.08); }
.brow { display: flex; align-items: flex-end; gap: 8px; margin-top: 8px; }
.brow.cont { margin-top: 3px; }
.brow.me { justify-content: flex-end; }
.ava-gap { width: 30px; flex: none; }
.bcol { display: flex; flex-direction: column; align-items: flex-start; max-width: 80%; min-width: 0; }
.bname { font-size: 12.5px; font-weight: 700; margin: 0 0 3px 12px; }
.bname.n0 { color: #6a2cf0; } .bname.n1 { color: #e0245e; } .bname.n2 { color: #1593c4; } .bname.n3 { color: #0a9b62; }
.bubble { display: inline-block; border: 0; text-align: left; font: inherit; font-size: 15.5px; line-height: 1.38; padding: 8px 12px 7px; border-radius: 19px;
  background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(91,43,217,.09); white-space: pre-wrap; word-break: break-word; max-width: 100%; margin: 0; }
.brow:not(.me) .bubble { border-bottom-left-radius: 7px; }
.brow.me .bubble { background: linear-gradient(135deg, #6a2cf0, #b02fd6); color: #fff; border-bottom-right-radius: 7px; max-width: 80%; box-shadow: 0 4px 12px rgba(106,44,240,.25); }
.bubble .t { display: inline-block; font-size: 11px; opacity: .62; margin-left: 9px; position: relative; top: 3px; white-space: nowrap; }
.bubble.deleted, .brow.me .bubble.deleted { background: transparent; color: var(--ink-soft); box-shadow: none; border: 1.5px dashed #d4c8f5; }
.bubble .gone { font-style: italic; }
button.bubble { cursor: pointer; }
button.bubble:active { filter: brightness(.96); }
.composer { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px); z-index: 5; display: flex; gap: 8px; align-items: center;
  margin-top: 12px; background: #fff; border-radius: 999px; padding: 6px 6px 6px 18px; box-shadow: 0 8px 24px rgba(91,43,217,.20); }
.composer input { flex: 1; border: 0; background: transparent; font-size: 16px; padding: 9px 0; min-width: 0; min-height: 0; box-shadow: none; }
.composer input:focus { outline: none; box-shadow: none; border: 0; }
.send { width: 44px; height: 44px; border-radius: 50%; border: 0; flex: none; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #6a2cf0, #ff3d8b); box-shadow: 0 4px 12px rgba(255,61,139,.35); }
.send svg { width: 20px; height: 20px; fill: currentColor; }
.send:active { transform: scale(.93); }
body.typing nav.bottom { display: none; }
body.typing .composer { position: static; }
.quote { background: var(--lake-soft); border-radius: 12px; padding: 9px 11px; word-break: break-word; white-space: pre-wrap; }
nav.bottom button { font-size: 11.5px; }


/* ================= заставка S7 ================= */
#splash { background: radial-gradient(120% 90% at 50% 40%, #4a21b8 0%, #2a1470 48%, #130a3a 100%); gap: 0; overflow: hidden; }
#splash .sp-glow { position: absolute; width: 520px; height: 520px; border-radius: 50%; left: 50%; top: 50%; margin: -260px 0 0 -260px;
  background: radial-gradient(circle, rgba(255,90,165,.34) 0%, rgba(124,58,237,.22) 35%, transparent 68%); opacity: 0; animation: spGlow 2.4s ease-out .1s forwards; }
#splash .sp-logo { width: 190px; height: 190px; position: relative; opacity: 0; animation: spPop .7s cubic-bezier(.2,1.3,.4,1) .05s forwards; }
#splash .sp-ring { stroke-dasharray: 1; stroke-dashoffset: 1; animation: spDraw 1.3s cubic-bezier(.5,0,.2,1) .15s forwards; }
#splash .sp-ring2 { stroke-dasharray: .02 .03; opacity: 0; animation: spFade .8s ease 1.1s forwards, spSpin 14s linear 1.1s infinite; transform-origin: 100px 100px; }
#splash .sp-c, #splash .sp-7a, #splash .sp-7b { stroke-dasharray: 1; stroke-dashoffset: 1; }
#splash .sp-c { animation: spDraw .7s cubic-bezier(.6,0,.2,1) .55s forwards; }
#splash .sp-7a { animation: spDraw .28s ease-out 1.05s forwards; }
#splash .sp-7b { animation: spDraw .4s ease-out 1.3s forwards; }
#splash .sp-dots circle { opacity: 0; transform-origin: 100px 100px; animation: spDot 1.1s ease-out 1.5s forwards; }
#splash .sp-dots circle:nth-child(even) { animation-delay: 1.62s; }
#splash .sp-name { margin-top: 22px; font: 600 17px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .6em; color: #ffe6f1; opacity: 0; padding-left: .6em;
  animation: spName 1.1s cubic-bezier(.2,.7,.2,1) 1.5s forwards; }
#splash .bar { width: 96px; height: 2px; margin-top: 26px; opacity: 0; animation: spFade .4s ease 1.4s forwards; }
#splash .bar i { animation: fill 1.2s linear 1.5s forwards; transform: scaleX(0); }
@keyframes spPop { from { opacity: 0; transform: scale(.55) rotate(-8deg); } to { opacity: 1; transform: none; } }
@keyframes spDraw { to { stroke-dashoffset: 0; } }
@keyframes spFade { to { opacity: 1; } }
@keyframes spSpin { to { transform: rotate(450deg); } }
@keyframes spGlow { 0% { opacity: 0; transform: scale(.5); } 45% { opacity: 1; } 100% { opacity: .85; transform: scale(1.1); } }
@keyframes spDot { 0% { opacity: 0; transform: scale(.4); } 30% { opacity: 1; } 100% { opacity: .55; transform: scale(1.04); } }
@keyframes spName { from { opacity: 0; letter-spacing: 1.1em; } to { opacity: 1; letter-spacing: .6em; } }
@media (prefers-reduced-motion: reduce) { #splash * { animation-duration: .01s !important; animation-delay: 0s !important; } }

/* ================= отсчёт ================= */
.cdl-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.cdl-label { font-size: 13px; font-weight: 600; opacity: .75; }
.cdl-digits { display: flex; align-items: flex-end; gap: 3px; font-variant-numeric: tabular-nums; }
.cdl-digits b { font-size: 24px; line-height: 1; font-weight: 800; }
.cdl-digits small { font-size: 11px; opacity: .6; margin: 0 5px 2px 1px; font-weight: 600; }
.cdl-foot { margin-top: 8px; font-size: 13px; opacity: .85; font-weight: 500; text-align: left; }

/* ================= огоньки ================= */
.flame { display: inline-flex; align-items: center; gap: 1px; font-size: 13px; font-weight: 800; color: #e8590c; margin-left: 6px; vertical-align: 1px; }
.flame i { font-style: normal; display: inline-block; transform-origin: 50% 90%; animation: flick 1.6s ease-in-out infinite; filter: drop-shadow(0 0 5px rgba(255,120,30,.55)); }
.flame.off { color: #9a93b8; }
.flame.off i { animation: none; filter: grayscale(1) opacity(.55); }
@keyframes flick { 0%,100% { transform: scale(1) rotate(-2deg); } 30% { transform: scale(1.14, 1.2) rotate(2deg); } 60% { transform: scale(.96, 1.05) rotate(-1deg); } }

/* ================= верхняя панель, настройки ================= */
.refresh { border: 0; background: #fff; color: var(--violet); width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(91,43,217,.14); cursor: pointer; flex: none; }
.refresh svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.refresh:active svg { transform: rotate(180deg); transition: transform .3s; }
.me-box { gap: 8px; }
.row.set { align-items: center; gap: 12px; padding: 4px 0; }
.set + .set { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
.switch { position: relative; width: 50px; height: 30px; border-radius: 99px; border: 0; background: #cfc7ee; cursor: pointer; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); transition: transform .2s; }
.switch.on { background: linear-gradient(135deg, #6a2cf0, #b02fd6); }
.switch.on::after { transform: translateX(20px); }
body.hide-sums .bal, body.hide-sums .num { filter: blur(7px); }
body.bigtext { -webkit-text-size-adjust: 114%; text-size-adjust: 114%; font-size: 18px; }
.item.tap { cursor: pointer; }
.item.tap:active { background: rgba(124,58,237,.06); }
.hist-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.hist-row:first-child { border-top: 0; }
.action-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.action-pair .btn { margin: 0; }

/* ================= тёмная тема ================= */
html[data-theme="dark"] { color-scheme: dark;
  --snow: #120e2b; --paper: #1d1840; --ink: #ece8ff; --ink-soft: #a79fd3; --line: #352d66; --lake: #a78bfa; --lake-deep: #ece8ff; --lake-soft: #2a2354;
  --good: #3ddc97; --good-bg: #123a2c; --warn-bg: #3a2e10; --bad: #ff6b8e; --bad-bg: #40162a; --info-bg: #1f2a55; }
html[data-theme="dark"] body { background: linear-gradient(180deg, #181238 0%, #120e2b 240px, #0f0b24 100%) fixed; color: var(--ink); }
html[data-theme="dark"] .panel, html[data-theme="dark"] .modal, html[data-theme="dark"] nav.bottom { background: var(--paper); }
html[data-theme="dark"] .quick button, html[data-theme="dark"] .note-chip, html[data-theme="dark"] .cdl, html[data-theme="dark"] .refresh,
html[data-theme="dark"] .chat-empty, html[data-theme="dark"] .bubble, html[data-theme="dark"] .composer { background: var(--paper); color: var(--ink); }
html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea { background: #15112f; color: var(--ink); border-color: var(--line); }

html[data-theme="dark"] .seg { background: #261f52; }
html[data-theme="dark"] .seg button { color: #c9c1ee; }
html[data-theme="dark"] .bar, html[data-theme="dark"] .bar.thin, html[data-theme="dark"] .cdl-bar { background: #2a2354; }
html[data-theme="dark"] .quick button { color: #ece8ff; }
html[data-theme="dark"] .qb { border-color: var(--paper); }
html[data-theme="dark"] .topbar .brand { background: linear-gradient(90deg, #b49cff, #ff7ab8); -webkit-background-clip: text; background-clip: text; color: transparent; }
html[data-theme="dark"] .chip-s.due, html[data-theme="dark"] .chip-s.pending, html[data-theme="dark"] .chip-s.voting { background: #232d63; color: #9db0ff; }
html[data-theme="dark"] .msg.info { background: var(--info-bg); color: var(--ink); }
html[data-theme="dark"] .msg.warn { background: var(--warn-bg); color: var(--ink); }
html[data-theme="dark"] .msg.danger { background: var(--bad-bg); color: var(--ink); }
html[data-theme="dark"] .big { color: #c4b5fd; }
html[data-theme="dark"] h2 { color: #ece8ff; }
html[data-theme="dark"] .linkbox { background: #2a2354; }
html[data-theme="dark"] .switch { background: #3b3470; }
html[data-theme="dark"] .quote { background: #2a2354; }
html[data-theme="dark"] .toast { background: #3b2f7a; color: #fff; }
html[data-theme="dark"] .modal-bg { background: rgba(5, 3, 20, .72); }

/* ================= правки: огоньки, фото, назад ================= */
.ava { overflow: hidden; }
.ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ava.lg { width: 64px; height: 64px; font-size: 26px; }
.backlink { border: 0; background: transparent; color: var(--violet); font-weight: 700; font-size: 15px; padding: 6px 0 0; cursor: pointer; }
.flames { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.fl { text-align: center; cursor: pointer; min-width: 0; }
.flsvg { width: 46px; height: 58px; display: block; margin: 0 auto; transform-origin: 50% 92%; }
.fl.lit .flsvg { animation: flA 1.6s ease-in-out infinite; }
.fl.lit.f0 .flsvg { filter: drop-shadow(0 0 9px rgba(168, 85, 247, .75)); animation-duration: 1.7s; }
.fl.lit.f1 .flsvg { filter: drop-shadow(0 0 10px rgba(255, 90, 100, .8)); animation-duration: 1.25s; animation-name: flB; }
.fl.lit.f2 .flsvg { filter: drop-shadow(0 0 9px rgba(14, 165, 233, .75)); animation-duration: 2.1s; }
.fl.lit.f3 .flsvg { filter: drop-shadow(0 0 9px rgba(132, 204, 22, .75)); animation-duration: 1.45s; animation-name: flB; animation-delay: .3s; }
.fl-n { font-weight: 800; font-size: 20px; line-height: 1.1; margin-top: 2px; }
.fl:not(.lit) .fl-n { color: var(--ink-soft); }
.fl-name { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes flA { 0%,100% { transform: scale(1, 1) rotate(-2deg); } 35% { transform: scale(1.06, 1.12) rotate(2.5deg); } 70% { transform: scale(.97, 1.04) rotate(-1deg); } }
@keyframes flB { 0%,100% { transform: scale(1, 1.03) skewX(-3deg); } 25% { transform: scale(1.08, .98) skewX(3deg); } 55% { transform: scale(.96, 1.1) skewX(-2deg); } 80% { transform: scale(1.03, 1.02) skewX(2deg); } }
/* ---- карта S7: фиолетово-розовая + стекло и сияние ---- */
.simcard { min-height: 214px; padding: 22px 24px 20px; border-radius: 22px;
  background: radial-gradient(120% 90% at 0% 0%, #8b5cf6 0%, transparent 55%), radial-gradient(90% 90% at 100% 100%, #f43f8e 0%, transparent 60%), linear-gradient(135deg, #5b21b6, #c026d3 55%, #ec4899);
  box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 22px 44px -14px rgba(124,58,237,.6), 0 6px 14px rgba(40,10,90,.3); }
.simcard::before { display: none; }
.simcard::after { z-index: 4; border-radius: 22px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.24); }
.simcard > i, .simcard > b { position: absolute; display: block; pointer-events: none; }
.simcard .o1 { width: 230px; height: 230px; border-radius: 50%; left: -70px; bottom: -120px; background: #7c3aed; filter: blur(50px); opacity: .85; }
.simcard .o2 { width: 200px; height: 200px; border-radius: 50%; right: -60px; top: -80px; background: #ff4fa3; filter: blur(50px); opacity: .7; }
.simcard .o3 { width: 150px; height: 150px; border-radius: 50%; right: 30px; bottom: -80px; background: #22d3ee; filter: blur(46px); opacity: .5; }
.simcard .glass { inset: 9px; border-radius: 15px; background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.03)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); z-index: 0; }
.simcard .big { right: -12px; top: -30px; font: italic 900 170px/1 system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: -.06em; color: transparent;
  -webkit-text-stroke: 1.5px rgba(255,255,255,.34); background: linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,0)); -webkit-background-clip: text; background-clip: text; z-index: 0; }
.simcard .sheen { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.26) 42%, rgba(255,255,255,.05) 50%, transparent 60%); }
.simcard .top { font-weight: 500; letter-spacing: .02em; }
.simcard .logo { font: italic 900 30px/1 system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: -.05em; color: #fff; text-shadow: 0 2px 10px rgba(40,10,90,.4); }
.simcard .chiprow { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.simcard .chip { width: 46px; height: 35px; margin: 0; border-radius: 7px; position: relative;
  background: linear-gradient(135deg, #f7e2a1, #d4a84a 45%, #f2d98b 70%, #b98a2e); box-shadow: inset 0 0 0 1px rgba(138,98,26,.55), 0 1px 2px rgba(0,0,0,.3); }
.simcard .chip::before { content: ""; position: absolute; inset: 0; border-radius: 7px; background:
  linear-gradient(rgba(138,98,26,.4), rgba(138,98,26,.4)) 50% 0 / 1px 100% no-repeat, linear-gradient(rgba(138,98,26,.4), rgba(138,98,26,.4)) 0 30% / 100% 1px no-repeat,
  linear-gradient(rgba(138,98,26,.4), rgba(138,98,26,.4)) 0 50% / 100% 1px no-repeat, linear-gradient(rgba(138,98,26,.4), rgba(138,98,26,.4)) 0 70% / 100% 1px no-repeat; }
.simcard .nfc { width: 26px; height: 26px; opacity: .9; }
.simcard .lbl { margin-top: 14px; opacity: .85; }
.simcard .bal { font: 700 36px/1.1 system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: -.02em; text-shadow: 0 2px 8px rgba(40,10,90,.3); }
.simcard .bottom { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: #fff; opacity: .92; align-items: center; }
.simcard .bottom b { font-weight: 700; letter-spacing: .08em; }
/* ---- копилка, график, достижения, лента, реакции, упоминания ---- */
.goal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.goal-title { font-size: 18px; font-weight: 800; }
.goal-bar { height: 16px; border-radius: 999px; background: rgba(124,58,237,.14); overflow: hidden; margin-top: 12px; position: relative; }
.goal-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #7c3aed, #ec4899, #f59e0b); transition: width .9s cubic-bezier(.2,.8,.2,1); position: relative; }
.goal-bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%); background-size: 200% 100%; animation: goalShine 2.6s linear infinite; }

.presets button:active { background: rgba(124,58,237,.12); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-soft); font-size: 9.5px; }
.fx{background:var(--paper);border-radius:22px;padding:16px;margin-bottom:10px;box-shadow:0 8px 22px -12px rgba(91,43,217,.35);display:flex;flex-direction:column;gap:10px}

.fx .fxlbl{color:var(--ink-soft);font-size:13px}
.fx .fxbig{font-weight:800;font-size:52px;line-height:1;letter-spacing:-.02em;color:var(--lake-deep);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fx .fxbadge{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;letter-spacing:0}
.fx .fxbadge.dn{background:var(--bad-bg);color:var(--bad)}.fx .fxbadge.up{background:var(--good-bg);color:var(--good)}
.fx .fxchart text{fill:var(--ink-soft);font-size:10px}
.fx .fxconv{position:relative;border:1px solid var(--line);border-radius:18px;padding:4px 14px}
.fx .fxf{display:flex;align-items:center;gap:10px;padding:8px 0}
.fx .fxf+.fxf{border-top:1px solid var(--line)}
.fx .fxf label{display:block;font-size:12px;color:var(--ink-soft)}
.fx .fxf input{width:100%;min-width:0;border:0!important;background:transparent!important;font-weight:700;font-size:24px;color:var(--ink);outline:none;padding:0!important;margin:0!important;box-shadow:none!important;border-radius:0!important;height:auto!important}
.fx .fxf b.cur{margin-left:auto;color:var(--violet)}
.fx .fxswap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38px;height:38px;margin:0;padding:0;z-index:1;border:0;border-radius:50%;background:var(--violet);color:#fff;font-size:18px;cursor:pointer}
.fx .fxnote{font-size:12px;color:var(--ink-soft)}
.chart .gl { stroke: var(--violet); stroke-opacity: .35; stroke-dasharray: 3 3; }
.ach { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 6px; }
.ach > div { text-align: center; font-size: 11.5px; line-height: 1.2; color: var(--ink); }
.ach .em { font-size: 28px; width: 52px; height: 52px; margin: 0 auto 4px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: linear-gradient(135deg, rgba(124,58,237,.16), rgba(236,72,153,.18)); }
.ach .off { opacity: .42; filter: grayscale(1); }
.feed .item { display: flex; gap: 10px; align-items: flex-start; }
.feed .ic { width: 30px; height: 30px; flex: none; border-radius: 10px; background: rgba(124,58,237,.12); display: flex; align-items: center; justify-content: center; font-size: 15px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; overflow: hidden; }
.confetti span { position: absolute; top: -16px; width: 9px; height: 14px; border-radius: 2px; animation: cfFall linear forwards; }
@keyframes cfFall { to { transform: translate3d(var(--dx), 105vh, 0) rotate(var(--rot)); opacity: .9; } }
.mchips { flex: 0 0 100%; order: -1; display: flex; gap: 6px; overflow-x: auto; padding: 2px 12px 6px 0; margin-left: -6px; }
.mchips button { flex: none; border: 0; border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; font-weight: 600; color: var(--violet); background: rgba(124,58,237,.12); cursor: pointer; }
.composer { flex-wrap: wrap; border-radius: 26px; }
.mention { font-weight: 800; color: #7c3aed; background: rgba(124,58,237,.14); border-radius: 6px; padding: 0 3px; }
.brow.me .mention { color: #fff; background: rgba(255,255,255,.24); }
.mention.me { color: #fff; background: #7c3aed; }
.bubble.tome { box-shadow: 0 0 0 2px #ec4899; }
.bcol.meb { align-items: flex-end; }
.rx { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; align-items: center; }
.rx button { border: 1px solid rgba(124,58,237,.28); background: rgba(124,58,237,.07); color: var(--ink); border-radius: 999px; padding: 1px 8px; font: inherit; font-size: 13px; cursor: pointer; line-height: 1.5; }
.rx button.mine { background: rgba(124,58,237,.22); border-color: #7c3aed; font-weight: 700; }
.rx .rxadd { color: var(--ink-soft); opacity: .65; padding: 1px 7px; }
.rxpick { display: flex; gap: 2px; background: var(--paper, #fff); border-radius: 999px; padding: 3px 6px; box-shadow: 0 6px 18px rgba(60,20,140,.22); margin-top: 3px; }
.rxpick button { border: 0; background: transparent; font-size: 21px; padding: 2px 5px; cursor: pointer; }
nav.bottom .badge.at, .qb.at { background: #ef4444; animation: atPulse 1.6s ease-in-out infinite; }
@keyframes atPulse { 50% { box-shadow: 0 0 0 5px rgba(239,68,68,.22); } }
html[data-theme="dark"] .composer input, .composer input { background: transparent !important; box-shadow: none !important; }
.mchips { scrollbar-width: none; }
.mchips::-webkit-scrollbar { display: none; }

/* ================= ПЛАСТИЛИН 3D ================= */
:root {
  --clay-bg: #e9e4f7; --clay: #f3effd; --clay-ink: #3a335a; --clay-soft: #8b84ab;
  --v1: #a58cf2; --v2: #7a5ce0; --v-deep: #4a3f7a; --mint1: #7fdcb3; --mint2: #4fbf8f; --coral1: #ffb39a; --coral2: #f58b6b; --rose: #e8587a;
  --sh-out: 10px 10px 22px #cdc6e6, -8px -8px 18px #ffffff; --sh-out-s: 6px 6px 12px #d0c9e8, -5px -5px 12px #ffffff;
  --sh-in: inset 4px 4px 9px #d2cbe9, inset -4px -4px 9px #ffffff; --puff: inset 2px 2px 5px rgba(255,255,255,.45), inset -3px -4px 8px rgba(40,20,110,.22);
  --lake: #7a5ce0; --lake-deep: #3a335a; --violet: #7a5ce0; --pink: #e8587a; --ink: #3a335a; --ink-soft: #8b84ab; --line: #ddd6f1; --paper: #f3effd;
  --good: #2f9e72; --bad: #d94a6b; --good-bg: #dcf5ea; --bad-bg: #ffe2ea; --warn-bg: #fff1d4; --info-bg: #e9e4fb;
}
html[data-theme="dark"] {
  --clay-bg: #1d1a2e; --clay: #25213a; --clay-ink: #ece8ff; --clay-soft: #9d96c4;
  --sh-out: 8px 8px 18px #141223, -6px -6px 16px #2b2744; --sh-out-s: 5px 5px 10px #141223, -4px -4px 10px #2b2744;
  --sh-in: inset 4px 4px 9px #141223, inset -4px -4px 9px #2d2946;
  --ink: #ece8ff; --ink-soft: #9d96c4; --line: #322d4d; --paper: #25213a; --lake-deep: #ece8ff;
  --good: #5fd3a2; --bad: #ff7d9a; --good-bg: #1d3a30; --bad-bg: #42203094; --warn-bg: #3d3420; --info-bg: #2c2750;
}
body, html[data-theme="dark"] body { background: var(--clay-bg) !important; color: var(--clay-ink); font-family: Nunito, system-ui, sans-serif; font-weight: 600; }
button, input, select, textarea { font-family: Nunito, system-ui, sans-serif; }
h1, h2, h3, b, strong { font-weight: 800; }
h2 { color: var(--clay-ink) !important; font-size: 19px; font-weight: 900; letter-spacing: -.01em; margin: 26px 0 12px; }
h2::before { display: none !important; }
.muted, .role, .small.muted { color: var(--clay-soft); }
/* top */
.topbar { padding-bottom: 6px; align-items: center; }
.topbar .hello { display: flex; flex-direction: column; min-width: 0; }
.topbar .hello small { font-size: 14px; font-weight: 700; color: var(--clay-soft); }
.topbar .hello b { font-size: 25px; font-weight: 900; line-height: 1.15; letter-spacing: -.015em; color: var(--clay-ink); }
.me-box { gap: 10px !important; } .me-box .sync { margin: 0; }
.refresh, html[data-theme="dark"] .refresh { background: var(--clay) !important; box-shadow: var(--sh-out-s) !important; color: var(--v2) !important; width: 40px; height: 40px; border-radius: 14px; }
/* surfaces */
.panel, .panel.tight, .panel.empty, html[data-theme="dark"] .panel { background: var(--clay) !important; border: 0 !important; border-left: 0 !important; border-radius: 26px !important; box-shadow: var(--sh-out) !important; }
.panel.tight { overflow: hidden; }
.list > .item { border-top-color: var(--line); }
.note-chip, html[data-theme="dark"] .note-chip { background: var(--clay) !important; border: 0 !important; box-shadow: var(--sh-out-s) !important; color: var(--clay-soft); border-radius: 14px; padding: 7px 12px; }
.card-notes { margin-top: 14px; }
/* card */
.simcard { min-height: 0 !important; height: auto; padding: 22px 22px 20px !important; border-radius: 32px !important; gap: 22px; margin-top: 8px;
  background: linear-gradient(145deg, var(--v1), var(--v2)) !important;
  box-shadow: 14px 16px 28px rgba(122,92,224,.35), -8px -8px 18px rgba(255,255,255,.9), inset 3px 3px 8px rgba(255,255,255,.35), inset -6px -8px 14px rgba(60,30,140,.35) !important; }
html[data-theme="dark"] .simcard { box-shadow: 12px 14px 26px rgba(0,0,0,.45), -6px -6px 16px #2b2744, inset 3px 3px 8px rgba(255,255,255,.25), inset -6px -8px 14px rgba(40,20,110,.45) !important; }
.simcard::before, .simcard::after { display: none !important; }
.simcard .top { display: flex; justify-content: space-between; align-items: center; color: #fff !important; }
.simcard .logo { font: 900 26px/1 Nunito, sans-serif !important; letter-spacing: -.02em !important; text-shadow: none !important; font-style: normal !important; }
.simcard .bank { font-size: 13px; font-weight: 800; letter-spacing: .08em; opacity: .85; }
.simcard .lbl { color: rgba(255,255,255,.85) !important; font-size: 14px; font-weight: 700; margin: 0 !important; }
.simcard .bal { font: 900 40px/1.1 Nunito, sans-serif !important; letter-spacing: -.02em !important; text-shadow: 0 2px 6px rgba(60,30,140,.25) !important; color: #fff; }
.simcard .bottom { display: block !important; margin: 0 !important; color: rgba(255,255,255,.9) !important; font-size: 14px !important; font-weight: 800; text-transform: none !important; letter-spacing: 0 !important; }
/* tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
.tile { text-align: left; border: 0; background: var(--clay); border-radius: 26px; padding: 15px 16px; box-shadow: var(--sh-out); color: var(--clay-ink); cursor: pointer; font: inherit; }
.tile b { display: block; font-size: 24px; font-weight: 900; }
.tile small { display: block; color: var(--clay-soft); font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* inbox */
.inbox-it { display: flex; align-items: center; gap: 12px; background: var(--clay); border-radius: 26px; padding: 13px 14px; box-shadow: var(--sh-out); margin-bottom: 14px; }
.inbox-it .ava { width: 42px; height: 42px; border-radius: 16px !important; }
.inbox-it .ib-act { display: flex; gap: 6px; flex: none; }
.inbox-it .btn { min-height: 40px; padding: 0 14px; border-radius: 15px !important; font-size: 14.5px; }
.cta-big { display: block; width: 100%; margin-top: 20px; height: 62px; border: 0; border-radius: 24px; cursor: pointer; color: #fff; font: 900 18px Nunito, sans-serif;
  background: linear-gradient(145deg, #5a4d93, #2f2756); box-shadow: 10px 12px 24px rgba(47,39,86,.35), -6px -6px 14px rgba(255,255,255,.8), inset 2px 2px 6px rgba(255,255,255,.2); }
html[data-theme="dark"] .cta-big { background: linear-gradient(145deg, var(--v1), var(--v2)); box-shadow: var(--sh-out), var(--puff); }
.cta-big:active, .tile:active, .btn:active { transform: scale(.97); }
/* avatars */
.ava { border-radius: 40% !important; box-shadow: var(--puff) !important; }
.ava.c0 { background: linear-gradient(145deg, #b9a6ff, #8b6fef) !important; } .ava.c1 { background: linear-gradient(145deg, var(--coral1), var(--coral2)) !important; }
.ava.c2 { background: linear-gradient(145deg, #9fd0ff, #5f9fe8) !important; } .ava.c3 { background: linear-gradient(145deg, var(--mint1), var(--mint2)) !important; }
/* buttons */
.btn { border-radius: 18px !important; font-weight: 800; background: linear-gradient(145deg, var(--v1), var(--v2)) !important; box-shadow: 5px 6px 14px rgba(122,92,224,.35), var(--puff) !important; border: 0 !important; color: #fff !important; }
.btn.good { background: linear-gradient(145deg, var(--mint1), var(--mint2)) !important; box-shadow: 5px 6px 14px rgba(79,191,143,.35), var(--puff) !important; }
.btn.bad { background: linear-gradient(145deg, #ff9db3, var(--rose)) !important; box-shadow: 5px 6px 14px rgba(232,88,122,.35), var(--puff) !important; }
.btn.ghost, html[data-theme="dark"] .btn.ghost { background: var(--clay) !important; color: var(--v2) !important; box-shadow: var(--sh-out-s) !important; }
html[data-theme="dark"] .btn.ghost { color: #c4b5fd !important; }
.btn[disabled] { opacity: .45; }
/* inputs */
input, select, textarea, html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea { background: var(--clay) !important; border: 0 !important; border-radius: 16px !important; box-shadow: var(--sh-in) !important; color: var(--clay-ink) !important; min-height: 50px; }
input:focus, select:focus, textarea:focus { outline: 3px solid rgba(122,92,224,.35) !important; }
/* segmented */
.seg, html[data-theme="dark"] .seg { background: var(--clay) !important; box-shadow: var(--sh-in) !important; border-radius: 18px; padding: 5px; }
.seg button { border-radius: 14px; color: var(--clay-soft) !important; font-weight: 800; }
.seg button.on { background: linear-gradient(145deg, var(--v1), var(--v2)) !important; color: #fff !important; box-shadow: 4px 5px 10px rgba(122,92,224,.3), var(--puff) !important; }
/* switches */
.switch, html[data-theme="dark"] .switch { background: var(--clay) !important; box-shadow: var(--sh-in); }
.switch.on { background: linear-gradient(145deg, var(--mint1), var(--mint2)) !important; }
/* quick actions */
.quick button, html[data-theme="dark"] .quick button { background: var(--clay) !important; box-shadow: var(--sh-out) !important; border-radius: 24px; color: var(--clay-ink) !important; }
.quick { margin-top: 22px; gap: 12px; }
.quick .qi, .quick button:nth-child(n) .qi { border-radius: 16px; box-shadow: var(--puff); color: #fff !important; }
.quick button:nth-child(1) .qi { background: linear-gradient(145deg, var(--v1), var(--v2)) !important; }
.quick button:nth-child(2) .qi { background: linear-gradient(145deg, var(--coral1), var(--coral2)) !important; }
.quick button:nth-child(3) .qi { background: linear-gradient(145deg, #9fd0ff, #5f9fe8) !important; }
.quick button:nth-child(4) .qi { background: linear-gradient(145deg, var(--mint1), var(--mint2)) !important; }
.qb, nav.bottom .badge { background: var(--rose) !important; border-color: var(--clay) !important; }
/* countdown */
.cdl, html[data-theme="dark"] .cdl { background: var(--clay) !important; box-shadow: var(--sh-out) !important; border-radius: 26px; color: var(--clay-ink) !important; padding: 15px 16px; }
.cdl-bar, html[data-theme="dark"] .cdl-bar, .bar, .bar.thin, html[data-theme="dark"] .bar { background: var(--clay) !important; box-shadow: var(--sh-in); }
.cdl-bar i, .bar > i { background: linear-gradient(90deg, var(--v1), var(--v2)) !important; border-radius: 99px; }
.bar > i.full, .cdl.paid .cdl-bar i { background: linear-gradient(90deg, var(--mint1), var(--mint2)) !important; }
.cdl.late .cdl-bar i { background: linear-gradient(90deg, #ff9db3, var(--rose)) !important; }
/* messages */
.msg, html[data-theme="dark"] .msg.info, html[data-theme="dark"] .msg.warn, html[data-theme="dark"] .msg.danger { border: 0 !important; border-left: 0 !important; border-radius: 20px; box-shadow: var(--sh-out-s); font-weight: 700; color: var(--clay-ink); }
.msg.info { background: var(--clay) !important; } .msg.warn { background: var(--warn-bg) !important; } .msg.danger { background: var(--bad-bg) !important; color: var(--clay-ink) !important; }
.msg.action { background: linear-gradient(145deg, var(--v1), var(--v2)) !important; color: #fff !important; }
/* chips */
.chip-s { border-radius: 10px; font-weight: 800; }
/* goal */
.goal-bar { background: var(--clay) !important; box-shadow: var(--sh-in); height: 18px; }
.goal-bar i { background: linear-gradient(90deg, var(--v1), var(--v2)) !important; box-shadow: var(--puff); }
.goal-title { font-weight: 900; }
.presets button { border: 0 !important; background: var(--clay) !important; box-shadow: var(--sh-out-s); color: var(--v2) !important; font-weight: 800; }
/* achievements, feed */
.ach .em { background: var(--clay) !important; box-shadow: var(--sh-out-s); border-radius: 18px; }
.feed .ic { background: var(--clay) !important; box-shadow: var(--sh-out-s); border-radius: 12px; }
#cgl stop:first-child { stop-color: #a58cf2; } #cgl stop:last-child { stop-color: #7a5ce0; }
.chart .gl { stroke: var(--v2); }
/* bottom nav: floating clay pill */
nav.bottom, html[data-theme="dark"] nav.bottom { left: 14px; right: 14px; bottom: calc(10px + env(safe-area-inset-bottom)); height: var(--nav-h); padding: 0; border-radius: 26px;
  background: var(--clay) !important; box-shadow: var(--sh-out) !important; border: 0 !important; }
nav.bottom button { color: var(--clay-soft) !important; font-weight: 800; }
nav.bottom button.on { color: var(--v2) !important; }
html[data-theme="dark"] nav.bottom button.on { color: #c4b5fd !important; }
nav.bottom button.on::before { top: 6px !important; width: 46px !important; height: 30px !important; border-radius: 12px !important; background: linear-gradient(145deg, rgba(165,140,242,.25), rgba(122,92,224,.25)) !important; z-index: -1; }
nav.bottom button { z-index: 0; }
#app { padding-bottom: calc(var(--nav-h) + 40px + env(safe-area-inset-bottom)); }
.composer { bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 22px); }
/* chat */
.bubble, html[data-theme="dark"] .bubble { background: var(--clay) !important; box-shadow: var(--sh-out-s) !important; border-radius: 22px; color: var(--clay-ink) !important; }
.brow.me .bubble { background: linear-gradient(145deg, var(--v1), var(--v2)) !important; color: #fff !important; box-shadow: 5px 6px 14px rgba(122,92,224,.3), var(--puff) !important; }
.composer, html[data-theme="dark"] .composer { background: var(--clay) !important; box-shadow: var(--sh-out) !important; }
.composer input { box-shadow: none !important; }
.send { background: linear-gradient(145deg, var(--v1), var(--v2)) !important; box-shadow: var(--puff), 4px 5px 10px rgba(122,92,224,.35) !important; border-radius: 18px !important; }
.mchips button { background: var(--clay) !important; box-shadow: var(--sh-out-s); color: var(--v2) !important; font-weight: 800; }
.chat-day span, .chat-empty { background: var(--clay) !important; box-shadow: var(--sh-out-s) !important; color: var(--clay-soft); }
.rx button { background: var(--clay) !important; border: 0 !important; box-shadow: var(--sh-out-s); }
.rx button.mine { box-shadow: var(--sh-in) !important; color: var(--v2); }
.rxpick { background: var(--clay) !important; box-shadow: var(--sh-out) !important; }
/* modal, toast */
.modal, html[data-theme="dark"] .modal { background: var(--clay) !important; border-radius: 32px 32px 0 0; box-shadow: 0 -10px 30px rgba(60,40,140,.2); }
.modal-bg, html[data-theme="dark"] .modal-bg { background: rgba(58,51,90,.45) !important; backdrop-filter: blur(4px); }
.toast { border-radius: 18px; background: #3a335a !important; box-shadow: 8px 10px 22px rgba(47,39,86,.35); font-weight: 700; }
.toast.err { background: linear-gradient(145deg, #ff9db3, var(--rose)) !important; }
.linkbox, .quote, html[data-theme="dark"] .linkbox, html[data-theme="dark"] .quote { background: var(--clay) !important; box-shadow: var(--sh-in); border-radius: 16px; }
.backlink { color: var(--v2) !important; font-weight: 800; }
/* flames */
.fl-n { font-weight: 900; }
/* login */
.login h1 { background: none !important; color: var(--clay-ink) !important; -webkit-text-fill-color: currentColor; font: 900 34px Nunito, sans-serif; }
/* fonts */
.big, .simcard .bal, .login h1, h2, h3 { font-family: Nunito, system-ui, sans-serif !important; }
.big { font-weight: 900 !important; color: var(--v2) !important; }
html[data-theme="dark"] .big { color: #c4b5fd !important; }
html[data-theme="dark"] .refresh { color: #c4b5fd !important; }
.check input { box-shadow: var(--sh-in) !important; border-radius: 8px !important; min-height: 24px !important; accent-color: #4fbf8f; }
/* splash */
#splash { background: radial-gradient(120% 90% at 50% 40%, #a58cf2 0%, #7a5ce0 50%, #4a3f7a 100%) !important; }

/* --- v3: countdown colour, push banner, two quick buttons, wide screens --- */
.quick.two { grid-template-columns: 1fr 1fr; }
.cdl .cdl-bar i { background: linear-gradient(90deg, var(--cd1, #22c55e), var(--cd2, #16a34a)) !important; transition: width .6s linear; }
.cdl .cdl-digits b { color: var(--cd2, inherit); }
.pushbn { margin-top: 18px; padding: 14px 16px; border-radius: 24px; background: var(--clay); box-shadow: var(--sh-out); color: var(--clay-ink); display: flex; flex-direction: column; gap: 10px; }
.pushbn .btns { display: flex; gap: 8px; }
@media (min-width: 768px) {
  :root { --nav-h: 76px; }
  #app { max-width: 920px; padding-left: 132px; padding-right: 28px; padding-bottom: 40px; }
  nav.bottom, html[data-theme="dark"] nav.bottom { left: max(18px, calc(50% - 460px)) !important; right: auto !important; top: 22px; bottom: 22px !important; width: 96px; height: auto !important; max-height: 420px; }
  nav.bottom .inner { flex-direction: column; justify-content: flex-start; gap: 6px; padding-top: 12px; width: 100%; }
  nav.bottom button { min-height: 82px; width: 100%; flex: none; }
  nav.bottom button.on::before { top: 12px !important; }
  body.typing nav.bottom { display: flex; }
  .toast { bottom: 24px; }
  .composer { bottom: 18px; }
  #app.tab-chat { padding-bottom: 20px; }
  .simcard { max-width: 520px; }
}
@media (min-width: 1100px) {
  #app { max-width: 1240px; }
  nav.bottom, html[data-theme="dark"] nav.bottom { left: max(18px, calc(50% - 610px)) !important; }

/* ---- медали и стикеры ---- */
.ic-l { vertical-align: -4px; flex: none; }
.achm-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 6px; }
.achm { background: none; border: 0; padding: 0; font: inherit; color: var(--ink); text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent; box-shadow: none !important; }
.achm-i { display: block; width: 58px; height: 58px; margin: 0 auto 6px; filter: drop-shadow(0 3px 5px rgba(40,20,110,.28)); transition: transform .2s; }
.achm:active .achm-i { transform: scale(.92); }
.achm:not(.got) .achm-i { filter: none; }
.achm-i svg, .achov-medal svg { width: 100%; height: 100%; display: block; }
.achm-t { display: block; font-size: 11px; line-height: 1.2; }
.achm:not(.got) .achm-t { color: var(--ink-soft); }
.achov { position: fixed; inset: 0; z-index: 140; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(18,10,48,.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: achFade .3s ease both; overflow: hidden; }
.achov-card { position: relative; width: min(340px, 100%); text-align: center; padding: 26px 22px 20px; border-radius: 28px; background: var(--paper, #fff); color: var(--ink); box-shadow: 0 24px 60px rgba(0,0,0,.4); animation: achCard .5s cubic-bezier(.2,1.2,.3,1) both; }
.achov-top { font-size: 12.5px; letter-spacing: .04em; color: var(--ink-soft); margin-bottom: 14px; }
.achov-card h3 { margin: 14px 0 4px; font-size: 21px; }
.achov-card p { margin: 0 0 18px; color: var(--ink-soft); font-size: 14.5px; line-height: 1.45; }
.achov-medal { position: relative; width: 150px; height: 150px; margin: 0 auto; border-radius: 50%; overflow: hidden; filter: drop-shadow(0 8px 14px rgba(40,20,110,.35)); }
.achov.on .achov-medal { animation: achMedal 1s cubic-bezier(.2,1.1,.3,1) both .15s; }
.achov-shine { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.75) 50%, transparent 62%); transform: translateX(-120%); }
.achov.on .achov-shine { animation: achShine 1.3s ease .9s both; }
.achov-rays { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px; pointer-events: none; opacity: 0; background: repeating-conic-gradient(from 0deg, rgba(255,226,140,.34) 0 6deg, transparent 6deg 18deg); -webkit-mask-image: radial-gradient(circle, #000 0, transparent 62%); mask-image: radial-gradient(circle, #000 0, transparent 62%); }
.achov.on .achov-rays { animation: achRays 14s linear infinite, achRaysIn 1s ease .2s both; }
@keyframes achFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes achCard { from { opacity: 0; transform: translateY(30px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes achMedal { 0% { transform: scale(.2) rotate(-200deg); opacity: 0; } 60% { transform: scale(1.12) rotate(8deg); opacity: 1; } 100% { transform: none; } }
@keyframes achShine { to { transform: translateX(120%); } }
@keyframes achRays { to { transform: rotate(360deg); } }
@keyframes achRaysIn { to { opacity: 1; } }
.confetti { z-index: 150; }
.ava-btn { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; border-radius: 50%; line-height: 0; -webkit-tap-highlight-color: transparent; box-shadow: none !important; }
.ava-btn:active { transform: scale(.94); }

.prof-grid > div { padding: 10px 12px; border-radius: 14px; background: rgba(124,58,237,.07); }
.prof-grid small { display: block; color: var(--ink-soft); font-size: 11.5px; }
.prof-grid b { font-size: 16px; }
.prof-meds { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 4px 0 12px; }
.prof-meds span { width: 34px; height: 34px; display: block; }
.prof-meds span svg { width: 100%; height: 100%; }
.prof-btns { display: grid; gap: 8px; }
.stk-b { background: none !important; box-shadow: none !important; padding: 2px !important; }
.stk-b .t { display: block; text-align: right; opacity: .7; }
.stk { width: 118px; padding: 14px 8px 10px; border-radius: 22px; text-align: center; color: #fff; background: linear-gradient(145deg, var(--a), var(--b)); box-shadow: 0 6px 16px rgba(60,30,150,.28), inset 0 1px 0 rgba(255,255,255,.35); animation: stkPop .5s cubic-bezier(.2,1.3,.3,1) both; }
.stk .ic-l { width: 42px; height: 42px; stroke-width: 1.6; animation: stkFloat 2.4s ease-in-out infinite; }

.stk.s-flame .ic-l { animation: stkFlame 1.1s ease-in-out infinite; transform-origin: 50% 90%; }
.stk.s-bell .ic-l { animation: stkRing 1.6s ease-in-out infinite; transform-origin: 50% 10%; }
@keyframes stkPop { from { transform: scale(.3) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes stkFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes stkFlame { 0%,100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.12) rotate(3deg); } }
@keyframes stkRing { 0%,60%,100% { transform: rotate(0); } 10% { transform: rotate(16deg); } 20% { transform: rotate(-14deg); } 30% { transform: rotate(10deg); } 40% { transform: rotate(-6deg); } }
.stkbtn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center; background: rgba(124,58,237,.12); color: var(--violet, #6d3ae8); cursor: pointer; }
.stkpanel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px; width: 100%; }
.stkpanel button { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 16px; box-shadow: none !important; -webkit-tap-highlight-color: transparent; }
.stkpanel .stk { width: 100%; padding: 9px 2px 7px; border-radius: 16px; animation: none; box-shadow: 0 3px 8px rgba(60,30,150,.22); }
.stkpanel .stk .ic-l { width: 28px; height: 28px; animation: none; }
.stkpanel .stk { min-height: 78px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.stkpanel .stk b { font-size: 10.5px; margin-top: 3px; }
.stkpanel button:active .stk { transform: scale(.93); }

.chat-empty .ic-l { display: none; }
.stktabs { display: flex; gap: 6px; width: 100%; padding: 4px 10px 0; }
.stktabs button { border: 0; padding: 7px 16px; border-radius: 999px; background: rgba(124,58,237,.1); color: var(--ink-soft); font: inherit; font-size: 13px; cursor: pointer; box-shadow: none !important; }
.stktabs button.on { background: #6d3ae8; color: #fff; }
.gifpanel { width: 100%; padding: 8px 10px; }
.gifpanel input { width: 100%; margin-bottom: 8px; }

.chat-calls { display: flex; gap: 8px; }
.callbtn { width: 42px; height: 42px; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(124,58,237,.12); color: #6d3ae8; box-shadow: none !important; -webkit-tap-highlight-color: transparent; }
.callbn { display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin: 8px 0; border-radius: 18px; background: linear-gradient(135deg, #16a34a, #0d9488); color: #fff; }
.callbn > div { flex: 1; }
.callbn .muted { color: rgba(255,255,255,.85); }

.callov { position: fixed; inset: 0; z-index: 160; background: #120a30; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 10px calc(env(safe-area-inset-bottom) + 10px); }
.call-grid { flex: 1; display: grid; gap: 8px; padding: 10px 0; min-height: 0; grid-template-columns: 1fr; grid-auto-rows: 1fr; }

#splash#splash{background:radial-gradient(120% 80% at 50% 45%,#3b1a8c 0%,#2a1273 55%,#0f082e 100%)!important;gap:0!important;overflow:hidden;padding-bottom:9vh;transition:opacity .3s ease,visibility .3s!important}
#splash::before{content:"";position:absolute;inset:0;background:#000;opacity:1;animation:ppBlack .15s ease-out forwards}
#splash .pp-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:transparent}
#splash .pp-ico,#splash .pp-name{display:none}
#splash.nov .pp-ico{display:block}#splash.nov .pp-name{display:block}
#splash .pp-ico{position:relative;width:min(30vw,150px);aspect-ratio:1;border-radius:22.37%;opacity:0;transform:scale(.88);
  animation:ppIn .4s cubic-bezier(.16,.84,.3,1) .15s forwards}
#splash .pp-ico img{display:block;width:100%;height:100%;border-radius:inherit;animation:ppDepth .35s cubic-bezier(.4,0,.2,1) .55s both}
#splash .pp-ico::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  box-shadow:0 14px 28px -8px rgba(10,3,40,.55),inset 0 0 0 1px rgba(255,255,255,.12);animation:ppEdge .35s ease-out .55s forwards}
#splash .pp-name{margin-top:max(3.4vw,12px);font:600 clamp(26px,7.4vw,40px)/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  letter-spacing:.14em;padding-left:.14em;color:#fff;opacity:0;transform:translateY(8px);animation:ppName .35s cubic-bezier(.2,.7,.2,1) .75s forwards}
@keyframes ppBlack{to{opacity:0}}
@keyframes ppIn{to{opacity:1;transform:none}}
@keyframes ppDepth{0%{transform:scale(1)}45%{transform:scale(1.022)}100%{transform:scale(1)}}
@keyframes ppEdge{to{opacity:1}}
@keyframes ppName{to{opacity:1;transform:none}}
